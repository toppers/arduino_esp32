INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

/*  attachInterrupt: CFG_INT / ENA_DYNISR / AID_ISR (runtime/arduino, the
 *  C5 file: CLIC line 23). */
INCLUDE("arduino_interrupt_c5.cfg");
/*  The ESP-IDF OS shim's static objects (semaphores, AID_* budgets, timer
 *  task). Its S3/LX6 interrupt-line block is outside TOPPERS_ESP32C5; the
 *  C5 lines 25..39 come from esp_shim_intr_c5.cfg, which the runtime
 *  CMakeLists passes as a cfg file ahead of this one. */
INCLUDE("esp_shim.cfg");
/*  lwIP (D7, dev type): the tcpip_thread task NET_TSK and the sys_arch
 *  semaphore/mailbox pools (wifi/net/net.cfg). */
INCLUDE("net.cfg");

#include "phase9_wifi_connect_app.h"

/*
 *  ESP32-C5 (ports/m5stack_riscv, C5 plan stage 3) version of the C6 file
 *  ../wifi_connect/phase9_wifi_connect_app.cfg. The one difference is the
 *  attachInterrupt cfg it includes (arduino_interrupt_c5.cfg, line 23,
 *  instead of arduino_interrupt.cfg, line 19). The rest is the C6 text:
 *    - no TA_FPU: the RISC-V fmp3_core does not define it (the C5 has an
 *      FPU the port does not use; the cfg would fail on the undefined name).
 *    - CLASS(CLS_PRC1) is the single-core class of target_class.py.
 *  Plus INCLUDE("net.cfg"), which the Xtensa profile does not need (its
 *  toppers_netif.c creates the lwIP thread through the shim).
 *  The cfg is not switched with #ifdef (BUILDING.md: switching is done by
 *  which .cfg is passed): this is a separate file, chosen by
 *  scripts/build_prebuilt_stages.py CHIP_APPLICATIONS for the esp32c5.
 *  The .c and .h beside it are copies of the C6 ones (the application TU
 *  is one string; the task priority and stack size are the same).
 */
CLASS(CLS_PRC1) {
    CRE_TSK(ARDUINO_TASK, {
        TA_ACT,
        0,
        toppers_arduino_task,
        ARDUINO_TASK_PRIORITY,
        ARDUINO_TASK_STACK_SIZE,
        NULL
    });
}
