/*  The ESP-IDF OS shim's static objects (semaphores, AID_* budgets, timer
 *  task). Its S3/LX6 interrupt-line block is outside TOPPERS_ESP32C6; the
 *  C6 lines 1..15 come from esp_shim_intr_intmtx.cfg, which the runtime
 *  CMakeLists passes as a cfg file ahead of this one. */
INCLUDE("esp_shim.cfg");
/*  lwIP (D7, dev type): the tcpip_thread task NET_TSK and the sys_arch
 *  semaphore/mailbox pools (wifi/net/net.cfg). */
INCLUDE("net.cfg");

#include "phase9_wifi_connect_app.h"

/*
 *  ESP32-C6 (ports/m5stack_riscv) version of ports/m5stack_xtensa/app/
 *  wifi_connect/phase9_wifi_connect_app.cfg. Differences, both required by
 *  the target (same as the C6 minimal app, app/phase3):
 *    - no TA_FPU: the RISC-V fmp3_core does not define it (the C6 has no
 *      FPU), and the cfg would fail on the undefined name.
 *    - CLASS(CLS_PRC1) is the single-core class of target_class.py.
 *  Plus INCLUDE("net.cfg"), which the Xtensa profile does not need (its
 *  toppers_netif.c creates the lwIP thread through the shim).
 *  The cfg is not switched with #ifdef (BUILDING.md): this is a separate file.
 */
CLASS(CLS_PRC1) {
    CRE_TSK(ARDUINO_TASK, {
        TA_ACT,
        0,
        toppers_arduino_task,
        ARDUINO_TASK_PRIORITY,
        ARDUINO_TASK_STACK_SIZE,
        NULL
    });
}
