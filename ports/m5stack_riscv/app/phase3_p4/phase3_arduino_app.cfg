INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "phase3_arduino_app.h"

/*
 *  ESP32-P4 (ports/m5stack_riscv, StampP4 plan stage A1) copy of
 *  ../phase3/phase3_arduino_app.cfg. Two differences, both required by the
 *  target:
 *    - the target is SMP (TNUM_PRCID 2, plan P4), so the classes are the
 *      two-core set of target/m5stamp_esp32p4_gcc/target_class.py
 *      (CLS_PRC1 = 1, CLS_PRC2 = 2, CLS_ALL_PRC1 = 3, CLS_ALL_PRC2 = 4).
 *      The Arduino task stays on PRC1 (CLS_PRC1: assignable to PRC1 only,
 *      as on the single-core boards).
 *    - a second task, bound to PRC2 (CLS_PRC2), prints "[P4-CORE2] alive N"
 *      once a second: the console evidence that core1 runs the kernel (the
 *      dev seam-p4-smp's fmp_app has one such tick task per core).
 *  No TA_FPU, as in the C6 / C5 cfg (the RISC-V fmp3_core does not define
 *  it; the P4 chip layer handles its FPU / PIE / HWLP state without a task
 *  attribute).
 *  The cfg is not switched with #ifdef (BUILDING.md): this is a separate file.
 */
CLASS(CLS_PRC1) {
    CRE_TSK(ARDUINO_TASK, {
        TA_ACT,
        0,
        toppers_arduino_task,
        ARDUINO_TASK_PRIORITY,
        ARDUINO_TASK_STACK_SIZE,
        NULL
    });

    /*
     *  ★スケッチから使うカーネルオブジェクト（例題 Fmp3Sample1）。
     *  Xtensa 側 app/phase3/phase3_arduino_app.cfg と同じ理由・同じ形。
     *  `AID_CYC(n>0)` / `AID_ALM(n>0)` は「同じ種の静的生成が 1 個以上」を
     *  要求し、この profile には元々 1 個も無かったので、ダミーではなく
     *  例題がそのまま使う 1 個ずつを置く。周期は 1 秒固定（静的な周期通知の
     *  周期を後から変える API は TOPPERS に無い）。
     */
    CRE_CYC(SAMPLE_CYC, { TA_NULL,
        { TNFY_HANDLER, PRC1, toppers_fmp3_sample_cyclic }, 1000000, 0 });
    CRE_ALM(SAMPLE_ALM, { TA_NULL,
        { TNFY_HANDLER, PRC1, toppers_fmp3_sample_alarm } });
}

CLASS(CLS_PRC2) {
    CRE_TSK(CORE2_ALIVE_TASK, {
        TA_ACT,
        0,
        toppers_core2_alive_task,
        CORE2_ALIVE_TASK_PRIORITY,
        CORE2_ALIVE_TASK_STACK_SIZE,
        NULL
    });
}

/*
 *  ★タスクだけは動的生成。スタックはスケッチが渡すので、この API を使わない
 *  スケッチは RAM を払わない。3 本は例題 Fmp3Sample1 の縮約版に合わせた数。
 */
AID_TSK(3);
