INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "phase9_wifi_connect_app.h"

/*
 *  ESP32-P4 (ports/m5stack_riscv, plan 7 stage B) version of
 *  ../wifi_connect_c5/phase9_wifi_connect_app.cfg.
 *
 *  What this file does NOT include, and why: the C6 and C5 versions include
 *  esp_shim.cfg (the ESP-IDF OS shim's static objects) and net.cfg (the
 *  lwIP thread and its pools). This board's Wi-Fi is a companion chip over
 *  SDIO, so those objects come from the hosted layers' own cfg files -
 *  esp_shim_intr_clic.cfg, p4sdio.cfg, p4hosted.cfg, fmp3_lwip_pools.cfg
 *  and p4shim_diag.cfg - which the runtime CMakeLists passes ahead of this
 *  file (FMP3_CFG_FILES), exactly as it passes the interrupt-line cfg for
 *  the other two chips. Nothing is switched with #ifdef (BUILDING.md):
 *  which .cfg is passed is the switch, and this is a separate file chosen
 *  by scripts/build_prebuilt_stages.py CHIP_APPLICATIONS.
 *
 *  Classes: CLS_PRC1 carries the Arduino task, CLS_PRC2 the liveness task,
 *  the same split as the minimal profile (../phase3_p4).
 */
CLASS(CLS_PRC1) {
    CRE_TSK(ARDUINO_TASK, {
        TA_ACT,
        0,
        toppers_arduino_task,
        ARDUINO_TASK_PRIORITY,
        ARDUINO_TASK_STACK_SIZE,
        NULL
    });
}

CLASS(CLS_PRC2) {
    CRE_TSK(CORE2_ALIVE_TASK, {
        TA_ACT,
        0,
        toppers_p4_core2_alive_task,
        CORE2_ALIVE_TASK_PRIORITY,
        CORE2_ALIVE_TASK_STACK_SIZE,
        NULL
    });
}
