INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "phase3_arduino_app.h"

/*
 *  ESP32-C6 (ports/m5stack_riscv) copy of ports/m5stack_xtensa/app/phase3/
 *  phase3_arduino_app.cfg. Two differences, both required by the target:
 *    - no TA_FPU: the RISC-V fmp3_core does not define it (the C6 has no
 *      FPU; TA_FPU exists only in arch/xtensa_gcc, arm and arm64), and the
 *      cfg would fail on the undefined name.
 *    - CLASS(CLS_PRC1) is the single-core class of target_class.py
 *      (m5nanoc6_gcc: CLS_PRC1 = 1, CLS_ALL_PRC1 = 2; TNUM_PRCID is 1).
 *  The cfg is not switched with #ifdef (BUILDING.md): this is a separate file.
 */
CLASS(CLS_PRC1) {
    CRE_TSK(ARDUINO_TASK, {
        TA_ACT,
        0,
        toppers_arduino_task,
        ARDUINO_TASK_PRIORITY,
        ARDUINO_TASK_STACK_SIZE,
        NULL
    });
}
