/*
 *  シリアルインタフェースドライバのチップ依存部（ESP32-C5・非TECS）
 *  sio_initialize は software_init_hook から呼ぶため ATT_INI は置かない。
 *
 *  CRE_ISR の exinf は 1（siopid）とする。C5（C6 と同じ）の sio_isr(exinf)
 *  （chip_serial.c）は exinf をそのまま siopid として ESP32C5_SIO(isr)
 *  へ渡し，各ドライバ（esp32c5_usbjtag_hal.c／esp32c5_uart.c）は
 *  get_siopcb(siopid) で siopcb_table[siopid-1] を引くため，exinf=0 だと
 *  最初のコンソール割込みで範囲外アクセスになる（P4 の sio_isr は exinf を
 *  使わないため P4 の型をそのまま真似ると exinf=0 になっていた誤り）。
 */
ATT_TER({ TA_NULL, 0, sio_terminate });
CLASS(CLS_SERIAL) {
	CFG_INT(INTNO_SIO, { INTATR_SIO, INTPRI_SIO });
	CRE_ISR(ISR_SIO, { TA_NULL, 1, INTNO_SIO, sio_isr, ISRPRI_SIO });
}
