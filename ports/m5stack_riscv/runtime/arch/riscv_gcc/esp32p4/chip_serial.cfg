/*
 *    シリアルインタフェースドライバのチップ依存部（ESP32-P4 用）の
 *    コンフィギュレーションファイル（非TECS版専用）
 *
 *  $Id: chip_serial.cfg 148 2019-03-29 16:36:07Z ertl-honda $
 */

/* ATT_INI({ TA_NULL, 0, sio_initialize }); */
ATT_TER({ TA_NULL, 0, sio_terminate });

/*
 *  SIO(USB-Serial/JTAG TX=SERIAL_IN_EMPTY)割込みの登録．USB ソース(22)は
 *  割込みマトリクスで CLIC 外部線 INTNO_SIO に割付け(chip_serial.c sio_opn_por)，
 *  その線を本 ISR で受けて sio_irdy_snd を呼ぶ．CLS_SERIAL(=PRC1, core0)に配置．
 */
CLASS(CLS_SERIAL) {
    CFG_INT(INTNO_SIO, { INTATR_SIO, INTPRI_SIO });
    CRE_ISR(ISR_SIO, { TA_NULL, 0, INTNO_SIO, sio_isr, ISRPRI_SIO });
}
