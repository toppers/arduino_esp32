/*
 *  タスクの動的生成スロット予約（2026-08-04・段4）
 *
 *  `AID_*` は**クラスの外**に書く専用 API（`AID_MTX` の上の注記と同じ理由）。
 *
 *  ------------------------------------------------------------------------
 *  なぜ `ESP_SHIM_NUM_TSK` か（「決めた数」ではない。何を根拠に何を選んだか）
 *  ------------------------------------------------------------------------
 *  **新しい数を決めていない**——旧 `ESP_SHIM_NUM_TSK`（既定 6 ／ NimBLE 8 ／
 *    BlueDroid Classic 8）を**そのまま**読む。どの構成でも容量は 1 本も減らない。
 *
 *  **段1（`AID_MTX(16)`）・段2（`AID_SEM(28)`）と違い、構成ごとの分岐を畳んでいない。**
 *    理由を隠さない——**`tsk` の本数は `esp_shim.c` の `shim_tsk[]` スロット数と
 *    1:1 であり、さらに `esp_shim_tsk.c` の `shim_tsk_stack[][]`（スタック実体）とも
 *    1:1 だから**である。畳んで単一の数（例: 8）にすると、
 *      ・スロットとスタックを同じ数へ広げないと**予約だけ余る**（TCB 416 B ＋
 *        動的 TINIB が丸ごと死ぬ）。
 *      ・スタックを広げると **既定構成（6 本）の `.bss` が 2×`ESP_SHIM_TSK_STKSZ`
 *        ＝ 13,312〜16,384 B 増える**——最逼迫の構成（実測 `seam-s3-wifi`）の
 *        空きに直撃する。段2 が Classic の 96 を採らなかったのと同じ判断である。
 *    ⇒ **この段が消したのは「数の重複」であって「数の分岐」ではない。**
 *      旧構造は同じ数を **cfg の `CRE_TSK` 8 行・C 配列 `tskid_tbl[]`・
 *      マクロ `ESP_SHIM_NUM_TSK`** の 3 箇所に書いていた（段2 の sem では
 *      それが実際に食い違っていた。tsk 側の同型の穴——`tskid_tbl[]` が
 *      index 6/7 を列挙せず ID 0 を配っていた——は既に修正済みで、
 *      **本段の時点では 3 箇所が一致していた**。「直した」と書かない）。
 *      今は **`ESP_SHIM_NUM_TSK` の 1 箇所**だけである。
 *
 *  **十分性は示していない**（測っていないものを測ったと書かない）:
 *   ・実機ログの実測では、Wi-Fi blob が作るタスクは **'wifi' 1 本のみ**
 *     （両チップ・`TSKREQ total=1`。`.steering/20260804-blobpool-stack/`）。
 *     NimBLE 構成は 'btController' と 'nimble_host' の **2 本**。
 *     ⇒ 既定 6 枠／BLE 8 枠に対する既知の実需要は 1〜2 である。これは**上界ではない**。
 *   ・**自己削除→再生成のサイクルは実在する**（実測。単一 boot で同一 tskid が
 *     6 回再配布。発生源は M5Unified `Speaker`/`Mic`＝**音声プール側**）。
 *     blob プール側でサイクルは観測されていないが、**blob 内部は測れない**。
 *   ・足りなければ `acre_tsk` が `E_NOID` を返し、`esp_shim_task_create()` は
 *     0＋診断で fail-closed する（`esp/shim/esp_shim_tsk.c`）。
 *     スロットが `pend_del` で埋まっている場合は、生成の**先頭**で
 *     `shim_tsk_reap_pending()` が掃除するので**枯渇しない**。
 *
 *  2026-08-05（段7）: ここに在った「**`SHIM_AUDIO_TSK1/2` は静的のまま**（射程外）」は
 *    **もう当てはまらない**。音声プールも動的化した（上のブロック）。
 *    ⇒ 予約数は `ESP_SHIM_AID_NTSK` ＝ `ESP_SHIM_NUM_TSK + SHIM_AUDIO_NTSK`
 *      （`M5_SHIM_AUDIO` が無い構成では `ESP_SHIM_NUM_TSK` のまま＝**予約数は不変**）。
 */
AID_TSK(ESP_SHIM_AID_NTSK);

/*
 *  esp_timer_*（esp/shim/esp_timer_shim.c）のタイマタスクと起床用セマフォ
 *
 *  2026-07-27 レビュー esp-2：従来は esp/bt/bt.cfg の BT_TIMER_SEM／
 *  BT_TIMER_TSK として BT/BLE 構成にだけ存在した。Wi-Fi 構成にも本物の
 *  esp_timer が要る（phy_track_pll）ため、全構成共通でここへ移した。
 *  クラスは bt.cfg 当時と同じ CLS_ALL_PRC1（上のプールは CLS_PRC1 なので
 *  別ブロックにする）。
 */
CLASS(CLS_ALL_PRC1) {
	CRE_SEM(ESP_TIMER_SEM, { TA_NULL, 0, 1 });
	CRE_TSK(ESP_TIMER_TSK, { TA_ACT, 0, esp_timer_shim_task, ESP_TIMER_TASK_PRI, ESP_TIMER_STKSZ, NULL });
}

/*
 *  part1-8 検証計装（ESP_TIMER_LATE_PROBE・既定 OFF・検証専用／本番に残さない）
 *
 *  「目撃者」周期通知。ESP_TIMER_TSK の起床遅れ（タスク文脈）と対にして、
 *  カーネルのタイムイベント配送そのものが遅れたのかを分離するために置く。
 *  根拠：FMP3 の call_cyclic()（fmp3_core/kernel/cyclic.c:315）は
 *    signal_time()（同 time_event.c:709）のタイムイベント処理ループから
 *    **twai_sem のタイムアウトと同じループで**呼ばれる。⇒ 本ハンドラが
 *    定刻に走ったなら、同時刻のタスクタイムアウトも**配送は**定刻である。
 *  CLASS は CLS_PRC1（時刻管理プロセッサ）。CRE_CYC は
 *    「割付け可能プロセッサが時刻管理プロセッサのみ」でないと E_RSATR
 *    （fmp3_core/kernel/cyclic.py:68-70）。
 *  判定表: .steering/20260727-fable-fixes-batch1/part1-8-ac.md
 */
#ifdef ESP_TIMER_WITNESS
CLASS(CLS_PRC1) {
	/*
	 *  cycphs を 0 にしてはならなかった（2026-07-28 実測・26.8 秒の起動遅延）。
	 *  根本原因は 2026-07-28 に**修正済み**（.steering/20260728-hrt-raise-event-fix/）。
	 *  cycphs=0 は TA_STA のとき evttim=0（絶対時刻 0）で登録され、sta_ker() の
	 *  set_hrt_event() が EVTTIM_LE(0,0) の枝＝target_hrt_raise_event() を通る。
	 *  **旧実装**の xtensa_set_ccompare0(ccount+1) は構造的に必ず取りこぼすうえ
	 *  wsr.ccompare0 が保留中の tick も破壊し、evttim=0 がヒープの永久ルートとして
	 *  居座るので**自己回復経路が無かった**（後続の set_hrt_event は index==ROOT_INDEX で
	 *  ゲート）。⇒ CCOUNT が一周するまで（2^32/160MHz = 26.84 秒）tick が全停止した。
	 *  現行は「未来値書込み→事後検証→margin 4 倍で再試行」ゆえ cycphs=0 でも動くが、
	 *  変える利得が無いので触らない。3 点連鎖: .steering/20260728-cyc-startup-delay/README.md
	 */
	CRE_CYC(ESP_TIMER_WITNESS_CYC, { TA_STA, { TNFY_HANDLER, PRC1, esp_timer_witness_cyc },
									ESP_TIMER_WITNESS_PERIOD_US,
									ESP_TIMER_WITNESS_PERIOD_US });
}
#endif /* ESP_TIMER_WITNESS */