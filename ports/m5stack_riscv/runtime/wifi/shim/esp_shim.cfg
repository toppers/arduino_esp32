/*
 *  Wi-Fi os_adapter shimの静的プール（esp_shim_cfg.hと一致させること）
 */
#include "esp_shim_cfg.h"

/*  SHIM_TA_FPU は esp_shim_cfg.h で定義（無印ESP32=TA_FPU / それ以外=TA_NULL）。
 *  cfgファイル内には #define を書けないためヘッダで定義。 */
CLASS(CLS_PRC1) {

/*
 *  セマフォプール — **動的生成へ移した**（2026-08-04・段2）
 *
 *  実体は `AID_SEM()`（このブロックの外・下記）＋ `acre_sem`/`del_sem`
 *  （`esp/shim/esp_shim_sem.c`）。かつてここに在った
 *  `CRE_SEM(SHIM_SEM1..96)`（構成により 24/28/96 本が有効）は
 *  **プールごと廃止した**。
 *
 *  mtx（段1）と違い**ガード用の CRE_SEM を新設していない**。
 *  `AID_SEM(n>0)` は「同じオブジェクト種の静的生成が cfg 内に 1 個以上あること」を
 *  要求する（`fmp3/fmp3_core/kernel/kernel.py`）が、この cfg には
 *  **プール以外の静的セマフォ**（下の `SHIM_TIMER_SEM`／`ESP_TIMER_SEM`）が
 *  既に在るのでガードは自然に満たされる。
 *  それらは**シム自身の固定インフラ**（誰が個数を決めるかが違う。
 *  DESIGN-MEMO §4-2 の境界）なので**静的のまま残す**。
 *  2026-08-15（BL-G-3 段3）: ここに書いてあった `SHIM_QSEM1..16` は
 *  キュー実装ごと撤去した。**ガードは `SHIM_TIMER_SEM`／`ESP_TIMER_SEM` で
 *  引き続き満たされる**（`SHIM_QSEM*` に依存していなかった）。
 */

/*
 *  タイマタスクの起床用セマフォ
 */
CRE_SEM(SHIM_TIMER_SEM, { TA_NULL, 0, 1 });

/*
 *  ミューテックス — **動的生成へ移した**（2026-08-04・段1）
 *
 *  実体は `AID_MTX()`（このブロックの外・下記）＋ `acre_mtx`/`del_mtx`
 *  （`esp/shim/esp_shim_mtx.c`）。かつてここに在った `CRE_MTX` ×20
 *  （構成により 8/12/16 本が有効）は**プールごと廃止した**。
 *
 *  下の 1 本だけは残す必要がある。`AID_MTX(n>0)` は
 *  「同じオブジェクト種の静的生成が cfg 内に 1 個以上あること」を要求し、
 *  無ければ cfg エラー `E_OBJ` になる
 *  （`fmp3/fmp3_core/kernel/kernel.py:152-160`、
 *   `fmp3/fmp3_core/docs/dynamic-creation.md` §2.1「ガード（訂正E）」）。
 *  このミューテックスは**シムから一度も使われない**（`esp_shim_mtx.c` は
 *  `acre_mtx` が返す動的レンジの ID しか触らない）。使わないことが正しい——
 *  使うと「静的経路と動的経路の 2 本立て」になり、DESIGN-MEMO §4-1(2) が
 *  禁じた形になる。
 */
CRE_MTX(SHIM_MTX_AID_GUARD, { TA_NULL });

/*
 *  イベントフラグプール（W3④ SPP：btc_spp.cのtx_event_group専用．
 *  esp_shim_cfg.hのESP_SHIM_NUM_FLGと一致させること）
 */
#ifdef TOPPERS_ESP32_BT_BLUEDROID_CLASSIC
CRE_FLG(SHIM_FLG1, { TA_NULL, 0 });
CRE_FLG(SHIM_FLG2, { TA_NULL, 0 });
#endif

/*
 *  キュープールは**跡形も無い**（2026-08-15・BL-G-3 段3）
 *
 *  ここには
 *    ・`CRE_DTQ(SHIM_DTQ_AID_GUARD)`（`AID_DTQ(n>0)` が要求するガード）
 *    ・`CRE_SEM(SHIM_QSEM1..16)`（キュースロットの空き数トークン。
 *      構成により 4／8／16 本が有効）
 *  が在った。**キュー実装（`esp_shim_queue_*`）ごと撤去したので両方消した。**
 *  下の `AID_DTQ()` も消してある（この cfg にデータキューはもう 1 つも無い）。
 *
 *  【`AID_SEM(n>0)` のガードは壊れていない】`AID_SEM` は「同じオブジェクト種の
 *  静的生成が cfg 内に 1 個以上あること」を要求するが、`SHIM_TIMER_SEM` と
 *  `ESP_TIMER_SEM` が残るので条件は満たされる（`SHIM_QSEM*` に依存していない）。
 *  **`AID_SEM(28)`／`AID_SEM(96)` の数そのものは 1 も動かしていない**
 *  ——動的セマフォの需要は変わらないからである（消えたのは静的な 16 本）。
 */

/*
 *  タスクプール — **動的生成へ移した**（2026-08-04・段4）
 *
 *  ここに在った `CRE_TSK(SHIM_TSK1..8)`（構成により 6／8 本が有効。計 8 行＋分岐）は
 *  **削除した**。実体は `AID_TSK()`（このブロックの外・下記）＋
 *  `acre_tsk`/`mact_tsk`/`del_tsk`（`esp/shim/esp_shim_tsk.c`）である。
 *
 *  **スタックはシムが供給する（案B）**——`esp_shim_tsk.c` の
 *  `shim_tsk_stack[ESP_SHIM_NUM_TSK][ESP_SHIM_TSK_STKSZ]`（16 整列）が、
 *  ここが生成していた `_kernel_stack_SHIM_TSK1..8` と**同じ本数・同じサイズ**を持つ。
 *  カーネルメモリプール（`DEF_MPK`）は使わない（`stk != NULL` なので
 *  `TA_MEMALLOC` が立たない）。理由と却下した選択肢は `esp_shim_tsk.c` 冒頭が正本。
 *
 *  **優先度の分岐（SHIM_TSK1 だけ BT コントローラ級）は消えていない**——
 *  `esp_shim.c` の `shim_tsk_slot_pri()` が同じ分岐を持つ（`acre_tsk` の
 *  `itskpri` として実行時に渡す）。構造的には `freertos_prio` から直接写像できるが、
 *  それは BT-4 調査で入れた振る舞いの変更なので**本段では変えない**。
 *
 *  **`TA_FPU` の扱いも変えていない**——`esp_shim_tsk.c` が `SHIM_TA_FPU`
 *  （無印ESP32=TA_FPU／S3=TA_NULL）を**そのまま**渡す。
 *  `acre_tsk` は `TARGET_TSKATR == TA_FPU` を受け付ける
 *  （`fmp3/arch/xtensa_gcc/common/core_kernel_impl.h:85`）。
 *
 *  ガード用の `CRE_TSK` は**新設していない**。`AID_TSK(n>0)` は「同じオブジェクト種の
 *  静的生成が cfg 内に 1 個以上あること」を要求する（`fmp3/fmp3_core/kernel/kernel.py`）が、
 *  この cfg には**プール以外の静的タスク**（下の `SHIM_TIMER_TSK`／`ESP_TIMER_TSK`）が
 *  既に在るのでガードは自然に満たされる
 *  （段2 の `AID_SEM` と同じ形。段1 の mtx／段3 の dtq はガードが要った）。
 *  2026-08-05（段7）: ここに書いていた「M5_SHIM_AUDIO 構成では `SHIM_AUDIO_TSK1/2`」は
 *  **もう当てはまらない**（音声プールも動的化した）。ガードは上の 2 本で足りている。
 */

/*
 *  ets_timerディスパッチ用タイマタスク
 */
CRE_TSK(SHIM_TIMER_TSK, { SHIM_TA_FPU, 0, esp_shim_timer_task, ESP_SHIM_TIMER_TASK_PRI, 4096, NULL });

/*
 *  音声（M5Unified Speaker/Mic）専用プール — **動的生成へ移した**（2026-08-05・段7）
 *
 *  ここに在った `CRE_TSK(SHIM_AUDIO_TSK1/2, { TA_FPU, 0/1, esp_shim_audio_task_entry,
 *  SHIM_AUDIO_TASK_PRI, SHIM_AUDIO_TSK_STKSZ, NULL })` の 2 行は**削除した**。
 *  実体は `AID_TSK(ESP_SHIM_AID_NTSK)`（＝`ESP_SHIM_NUM_TSK + SHIM_AUDIO_NTSK`）＋
 *  `esp_shim_audio_tsk_create()`（`esp/shim/esp_shim_tsk.c`）である。
 *
 *  **なぜ音声だけ段4 から遅れたか**: 段4（blob プール）は**回収機構を実機で
 *  確かめられない段**だった（BLE/Wi-Fi はタスクを削除しない）。音声は
 *  **このリポジトリで create/delete サイクルが実測されている唯一の経路**である
 *  （単一 boot で 7 回生成。`.steering/20260804-dynamic-object-integration/
 *  object-lifetime-survey.md`）。⇒ 段7 で移し、**回収経路を実戦で検証する。**
 *
 *  **スタックはシムが供給する（案B）**——`esp_shim_tsk.c` の
 *  `shim_audio_stack[SHIM_AUDIO_NTSK][SHIM_AUDIO_TSK_STKSZ]`（16 整列）が、
 *  ここが生成していた `_kernel_stack_SHIM_AUDIO_TSK1/2` と**同じ本数・同じサイズ**を持つ。
 *  blob 側（段4）と同じ判断である。理由と却下した選択肢は `esp_shim_tsk.c` 冒頭が正本。
 *
 *  **`TA_FPU` は固定のまま**——`SHIM_TA_FPU`（LX6=TA_FPU／S3=TA_NULL）**ではない**。
 *  音声は両チップとも FPU を使う（`esp_shim_cfg.h` の同箇所）。
 *  `esp_shim_audio_tsk_create()` が `TA_FPU` を**そのまま**渡す。
 *  `acre_tsk` は `TARGET_TSKATR == TA_FPU` を受け付ける
 *  （`fmp3/arch/xtensa_gcc/common/core_kernel_impl.h:85`）。
 *
 *  **exinf（旧 2 番目のフィールドの 0/1）は帳簿 `shim_audio_tsk[]` の添字**であって
 *  コアではない。動的生成でも同じ値を `acre_tsk` の `exinf` として渡す。
 *
 *  **ガード用の `CRE_TSK` は要らない**——`AID_TSK(n>0)` が要求する「同じ種の静的生成が
 *  1 個以上」は、下の `SHIM_TIMER_TSK`／`ESP_TIMER_TSK` が満たす（段4 と同じ）。
 *  ⇒ この cfg からは `M5_SHIM_AUDIO` の分岐が**丸ごと消えた**。
 */

/*
 *  Wi-Fi用CPU割込み線（blobが_set_intr/_set_isrで使用する線．
 *  実際に使われる線番号は実機ログで確認し，必要なら追加する）
 *
 *  ESP32-C6（TOPPERS_ESP32C6、段4 Task 3・2026-09-14）: この線ブロック
 *  （0-3 と下の 23/27）は Xtensa の線番号で書かれている。C6 には線 0 が
 *  無く（cfg の TargetCheckCfgInt が拒否）、INHNO は (PRC1 << 16) | 線 の
 *  形なので、C6 では丸ごと外し、代わりに esp/shim/esp_shim_intr_intmtx.cfg
 *  （線 1..15、cmake/a1_c6_stage1.cmake が FMP3_CFG_FILES へ足す）を使う。
 *  S3/LX6 の行は 1 文字も動かしていない（#ifndef で包んだだけ）。
 */
#ifndef TOPPERS_ESP32C6
CFG_INT(0, { TA_NULL, -2 });
CFG_INT(1, { TA_NULL, -2 });
CFG_INT(2, { TA_NULL, -2 });
CFG_INT(3, { TA_NULL, -2 });
#ifdef ESP_SHIM_DYNISR_WIFI
/*
 *  BL-H-6 段3（2026-08-13・opt-in・既定 OFF）: Wi-Fi 系 L1 線（0-3）を
 *  動的 ISR へ載せ替える。段1（線 23/27）と同じ仕組み。
 *
 *  実測に基づく可否（.steering/20260811-blh6-dynisr/ §13）:
 *    線 0 の発火は 負荷なし 29/s ／ 2Mbps 270/s ／ 8Mbps 754/s。
 *    動的化の追加コストは +838 cyc/回 なので、8Mbps でも CPU 0.4% 未満。
 *    CPU 1% の分岐点 1,909/s に達するのは約 20Mbps の持続送信だが、
 *    その帯域は blob の既知クラッシュ問題（wifi_sta.c:1256-1262）で
 *    そもそも運用範囲外である。
 *  注意: 線 1/2/3 は測定走行で 1 度も発火しなかった（線 0 のみ）。
 *    AP モード等で使われる構成では別途確認が要る。
 */
ENA_DYNISR(0);
ENA_DYNISR(1);
ENA_DYNISR(2);
ENA_DYNISR(3);
#else
DEF_INH(0, { TA_NULL, esp_shim_inthdr_0 });
DEF_INH(1, { TA_NULL, esp_shim_inthdr_1 });
DEF_INH(2, { TA_NULL, esp_shim_inthdr_2 });
DEF_INH(3, { TA_NULL, esp_shim_inthdr_3 });
#endif /* ESP_SHIM_DYNISR_WIFI */
#endif /* !TOPPERS_ESP32C6 */

/*
 *  無印ESP32 BTコントローラblobがxt_set_interrupt_handler()で動的に使う
 *  CPU割込み線5・7・8（2026-07-15、W3実機トレースで確認。esp_shim_cfg.h
 *  ESP_SHIM_MAX_WIFI_INTNO=27のコメントが明記する「blobは1〜15を動的に
 *  使う」の実例。他のblobが将来別の1〜15番台の線を選ぶ可能性もあるため、
 *  0-3と同型のディスパッチ入口を用意しておく）。
 *
 *  S3非回帰ガード（2026-07-15）：無印ESP32（TOPPERS_ESP32_LX6）専用。ESP32-S3では
 *  USART_INTNO=5が既定（target_serial.h）で、この線5登録がCFG段階で
 *  「intno 5 duplicated」衝突を起こしBLEビルドが失敗するため除外する。
 *  無印ESP32はUARTを線17/18へ移しており線5が空くので有効。
 */
#ifdef TOPPERS_ESP32_LX6
CFG_INT(5, { TA_NULL, -2 });
CFG_INT(7, { TA_NULL, -2 });
CFG_INT(8, { TA_NULL, -2 });
#ifdef ESP_SHIM_DYNISR_LX6
/*
 *  BL-H-6 段2（2026-08-13・opt-in・既定 OFF）: LX6 の線 5/7/8 を動的 ISR へ。
 *
 *  **これらの線は現に使われている**（削除ではなく移行が正しい）:
 *  2026-07-15 の W3 実機トレースで、LX6 の BT コントローラ blob が
 *  `xt_set_interrupt_handler()` でこの 3 本を動的に選ぶことを確認している
 *  （`.steering/20260714-esp32-classic-wifi-bt/steering.md:759,853`）。
 *  `esp_shim_intr_lines.h:107-110` も「`esp_shim.cfg` の LX6 ブロックが
 *  線 5/7/8 を BT/Wi-Fi blob 用に既に使う」と明記し、それを避けて
 *  SD-over-SPI を線 4 に寄せている。
 *
 *  **未検証**: 段1（線23/27）・段3（線0-3）と違い、**実機で確かめていない**
 *  （LX6 板が接続されていないため）。発火レートも未測定。
 *  ⇒ LX6 板を繋いだら、まず `A1_BLH6_INTRATE` 相当でレートを測り、
 *    §9 の分岐点（1,909 回/秒）と突き合わせてから既定化を判断すること。
 */
ENA_DYNISR(5);
ENA_DYNISR(7);
ENA_DYNISR(8);
#else
DEF_INH(5, { TA_NULL, esp_shim_inthdr_5 });
DEF_INH(7, { TA_NULL, esp_shim_inthdr_7 });
DEF_INH(8, { TA_NULL, esp_shim_inthdr_8 });
#endif /* ESP_SHIM_DYNISR_LX6 */
#endif

/*
 *  BTコントローラのLevel-3割込み用CPU割込み線（BT-4調査）。
 *  ESP32-S3のハードウェア固定レベル3対応番号{11,15,22,23,27,29}のうち、
 *  11/15/29はESP-IDF実機でESP_CPU_INTR_DESC_FLAG_SPECIAL（内部profiling/
 *  timer1/sw1予約）、22はEDGE型のため、LEVEL型で汎用に使える23・27を
 *  bt_shim.cのesp_intr_alloc()が明示的に配線する
 *  （.claude/plans/sparkling-forging-taco.md参照）。
 */
#ifndef TOPPERS_ESP32C6	/* C6: 上の 0-3 ブロックと同じ理由で外す */
CFG_INT(23, { TA_NULL, -2 });
CFG_INT(27, { TA_NULL, -2 });
#ifdef ESP_SHIM_DYNISR_L3
/*
 *  BL-H-6 段1（2026-08-11・opt-in・既定 OFF）: 線 23/27 を動的 ISR
 *  （acre_isr）へ載せ替える。ENA_DYNISR と DEF_INH は同じ intno に
 *  対して排他（cfg が E_OBJ で弾く。interrupt.py:419-428）なので、
 *  DEF_INH 側は #else に置く。
 *
 *  段1 に 23/27 を選んだ理由（実測に基づく。.steering/20260811-blh6-dynisr/）:
 *    線 23 の発火は **30-32 回/秒**で、`call_isr` の追加コスト（ジャイアント
 *    ロック 2 往復＋キュー走査）を 1000 cyc と見積もっても CPU の 0.02%。
 *    CPU 1% を食うには 1,600 回/秒が要る＝**3 桁の余裕**がある。
 *    一方 Wi-Fi 系（線 0-3）のレートは未測定なので後段へ回す。
 *
 *  ENA_DYNISR の前提（cfg が検査する）:
 *    - CFG_INT と同じクラスの囲みの中に置くこと（クラス内 API）。
 *    - 系全体に静的 CRE_ISR が 1 本以上あること
 *      -> `arch/xtensa_gcc/esp32s3/chip_serial.cfg:17` の ISR_SIO が満たす。
 *    - AID_ISR はクラス外に置くこと（下記）。
 */
ENA_DYNISR(23);
ENA_DYNISR(27);
#else
DEF_INH(23, { TA_NULL, esp_shim_inthdr_23 });
DEF_INH(27, { TA_NULL, esp_shim_inthdr_27 });
#endif /* ESP_SHIM_DYNISR_L3 */
#endif /* !TOPPERS_ESP32C6 */

}

/*
 *  BL-H-6: 動的 ISR の CB を予約する。**線 1 本につき 1 個**要る
 *  （足りないと acre_isr が E_NOID を返し、その線の割込みがどこにも
 *  届かなくなる＝症状は「Wi-Fi/BLE が動かない」になる）。
 *  AID_ISR は**クラス外専用**である（interrupt.py の検査）。
 *
 *  段1（ESP_SHIM_DYNISR_L3）  = 線 23/27      -> 2 個
 *  段2（ESP_SHIM_DYNISR_LX6） = 線 5/7/8      -> 3 個（LX6 のみ）
 *  段3（ESP_SHIM_DYNISR_WIFI）= 線 0/1/2/3    -> 4 個
 *  **個数は足し合わせる**——C 側の登録本数とここがずれると起動時に静かに
 *  壊れる（足りない分は acre_isr が E_NOID を返し、症状は
 *  「その線の割込みが誰にも届かない」＝Wi-Fi/BLE が動かない）。
 */
/*  cfg ファイル内には #define を書けない（ヘッダで定義するのが本 repo の作法。
 *  このファイル冒頭の SHIM_TA_FPU の注記と同じ理由）ので、組合せを列挙する。
 *  段2 は LX6 限定なので、LX6 か否かで 2 系統に分かれる。  */
#ifdef TOPPERS_ESP32_LX6
#if defined(ESP_SHIM_DYNISR_LX6) && defined(ESP_SHIM_DYNISR_WIFI) && defined(ESP_SHIM_DYNISR_L3)
AID_ISR(9);
#elif defined(ESP_SHIM_DYNISR_LX6) && defined(ESP_SHIM_DYNISR_WIFI)
AID_ISR(7);
#elif defined(ESP_SHIM_DYNISR_LX6) && defined(ESP_SHIM_DYNISR_L3)
AID_ISR(5);
#elif defined(ESP_SHIM_DYNISR_LX6)
AID_ISR(3);
#elif defined(ESP_SHIM_DYNISR_WIFI) && defined(ESP_SHIM_DYNISR_L3)
AID_ISR(6);
#elif defined(ESP_SHIM_DYNISR_WIFI)
AID_ISR(4);
#elif defined(ESP_SHIM_DYNISR_L3)
AID_ISR(2);
#endif
#else	/* !TOPPERS_ESP32_LX6 (S3) */
#if defined(ESP_SHIM_DYNISR_WIFI) && defined(ESP_SHIM_DYNISR_L3)
AID_ISR(6);
#elif defined(ESP_SHIM_DYNISR_WIFI)
AID_ISR(4);
#elif defined(ESP_SHIM_DYNISR_L3)
AID_ISR(2);
#endif
#endif	/* TOPPERS_ESP32_LX6 */

/*
 *  ミューテックスの動的生成スロット予約（2026-08-04・段1）
 *
 *  `AID_*` は**クラスの外**に書く専用 API である（クラス内なら `E_RSATR`。
 *  `fmp3/fmp3_core/docs/dynamic-creation.md` §2.1）。だからここに在る。
 *
 *  ------------------------------------------------------------------------
 *  なぜ 16 か（「決めた数」ではない。何を根拠に何を選んだかを書く）
 *  ------------------------------------------------------------------------
 *  **16 は新しく決めた数ではない**——現行 cfg の 3 分岐（既定 8 ／
 *    NimBLE 12 ／ BlueDroid Classic 16）の**最大値をそのまま採った**ものである。
 *
 *  決めたのは数ではなく「**構成ごとに分けるのをやめる**」ことである。理由:
 *   1. 旧 3 分岐は「同じ個数を cfg（`CRE_MTX`）と C 配列（`shim_mtx_id[]`）と
 *      マクロ（`ESP_SHIM_NUM_MTX`）の 3 箇所に書く」構造で、**実際に食い違った**——
 *      NimBLE 分岐は `ESP_SHIM_NUM_MTX=12` なのに `shim_mtx_id[]` が 8 個しか
 *      初期化されず、9 個目以降が `mtxid=0` の非 NULL ハンドルを**エイリアスで
 *      返す**（＝排他が黙って消える）潜在バグを持っていた
 *      （実測: `.steering/20260717-shim-pool-gap-verification/`）。
 *      ⇒ 分岐値を機械的に写すと、**写す先が 1 箇所ではない**という欠陥ごと写る。
 *   2. DESIGN-MEMO §4-2 が数えた「個数の推測を 8 回外した」履歴は、
 *      すべてこの「構成ごとの個数」に対するものである。
 *
 *  **需要から決められないことを明記する**（測っていないものを測ったと書かない）:
 *   ・実測されている需要は **BLE 実機で 5 本**（起動＋advertising、
 *     追加確保 0 本。NimBLE 側の確保は全て `*_init()`。同上 §6 の実機ログ）。
 *   ・**Wi-Fi と BlueDroid Classic の需要は未実測**。旧 8／16 という値自体が
 *     推測であって測定値ではない（16 は「BlueDroid host 分 +8」というコメントのみ）。
 *  ⇒ 需要側から上界を決める材料が無いので、**「現行のどの分岐からも容量を
 *    減らさない」ことだけを条件に**最大値 16 を採った。これは十分性の証明ではない。
 *
 *  代償（実測）: 既定分岐（旧 8）・NimBLE 分岐（旧 12）の構成で MTXCB／MTXINIB が
 *    増える。実測値は `.steering/20260804-dcre-stage1-mtx/RESULT.md`。
 *
 *  枯渇したらどうなるか: `acre_mtx` が `E_NOID` を返し、`esp_shim_mutex_create()`
 *    は `NULL` を返して**診断を出す**（畳まない。`esp_shim_mtx.c`）。
 *    旧実装の "mutex pool exhausted" に相当するが、
 *    旧実装と違い**エイリアスして黙って通る経路が構造的に無い。**
 */
AID_MTX(16);

/*
 *  セマフォの動的生成スロット予約（2026-08-04・段2）
 *
 *  `AID_*` は**クラスの外**に書く専用 API（`AID_MTX` の上の注記と同じ理由）。
 *
 *  ------------------------------------------------------------------------
 *  なぜ 28 か（「決めた数」ではない。何を根拠に何を選んだかを書く）
 *  ------------------------------------------------------------------------
 *  **28 は新しく決めた数ではない**——旧 `ESP_SHIM_NUM_SEM` の 3 分岐
 *    （既定 24 ／ NimBLE 28 ／ BlueDroid Classic 96）のうち、
 *    **現行の 10 preset から到達できる 2 分岐の最大値**をそのまま採った。
 *
 *  **Classic の 96 は採っていない。これは容量の削減である。隠さずに書く。**
 *   ・到達不能である: `TOPPERS_ESP32_BT_BLUEDROID_CLASSIC` を定義するビルド定義は
 *     木の中に 1 つも無い（実測: `.cfg`/`.txt`/`CMakeLists.txt`/`CMakePresets.json` を
 *     全数 grep。classic フローは 2026-07-20 に全廃され、復元は
 *     branch `archive/trb-classic-cfg` のみ）。⇒ **今は建てられず、測れない。**
 *   ・無条件に 96 にすると **DRAM が予算に当たる**: 動的セマフォ 1 本あたり
 *     SEMCB 16 B ＋ 動的 SEMINIB 12 B ＝ 28 B が `.bss` に乗る
 *     （静的分の SEMINIB は `.rodata`）。既定分岐（24 本）の構成で 96 にすると
 *     `.bss` が **+2.3 KB** 増え、一番きつい `seam-lx6-m5-wifi` の空き 13,656 B の
 *     **約 17%** を食う。実測は `.steering/20260804-dcre-stage2-sem/logs/cfg-knob.txt`。
 *   ・**削っても黙って壊れない**: 足りなければ `acre_sem` が `E_NOID` を返し、
 *     `esp_shim_sem_create()` は NULL＋診断で fail-closed する（`esp_shim_sem.c`）。
 *   ⇒ **Classic を復活させる人は、この数を測り直すこと。**
 *
 *  決めたのは数ではなく「**構成ごとに分けるのをやめる**」ことである
 *    （段1 の `AID_MTX` と同じ理由——旧構造は同じ個数を cfg と C 配列とマクロの
 *     3 箇所に書いており、**実際に食い違っていた**: NimBLE 分岐は
 *     `ESP_SHIM_NUM_SEM=28` なのに `shim_sem_id[]` は 24 個しか初期化されず、
 *     25 個目以降は `semid==0` で "sem pool exhausted" になっていた
 *     ＝**28 と書いてあって実際は 24 だった**。
 *     実測: `.steering/20260717-shim-pool-gap-verification/`）。
 *  ⇒ **28 は「書いてある数」であると同時に「実際に配れる数」になった。**
 *    NimBLE 構成では**実効容量が 24 → 28 へ増えている**（数字は据え置きだが穴が塞がった）。
 *
 *  **需要から決められないことを明記する**（測っていないものを測ったと書かない）:
 *   ・セマフォ生成の実測ログが**存在しない**——`SHIMDIAG sem_create` は
 *     `-DSHIM_POOL_DIAG` の opt-in で、既定ビルドでは 1 行も出ない。
 *   ・分かっているのは「BLE の起動＋advertising で 24 のギャップに到達しなかった」
 *     （同上）＝**上界ではなく下界の不在**だけである。
 *  ⇒ **28 が十分であることは示していない。**示したのは
 *    「到達可能などの構成からも容量を減らしていない」ことと
 *    「足りなければ fail-closed する」ことだけ。
 *
 *  2026-08-08（LM-D-4 後半・実機で経路・原因とも確定）: 実機
 *    （Core Basic）で`osi_thread_create("BTU_TASK", ...)`がNULLを返す
 *    →`BTU_StartUp()`のerror_exit→`BTU_ShutDown()`→`btu_free_core()`
 *    →`l2c_free()`→`l2c_free_p_lcb_pool()`が`l2c_init()`未実行のまま
 *    `list_begin(NULL)`を呼び`assert(list != NULL)`（`list.c:262`）で
 *    停止、という経路は`--wrap`での実測で確定した（`osi_thread_create`
 *    の戻り値観測で`BTC_TASK`/`hciT`は成功・`BTU_TASK`のみ`ret=NULL`、
 *    `list_begin`の呼び出し元は`l2c_main.c:925`とaddr2lineで確認済み。
 *    `.steering/20260808-lm-d4-btclassic-cmake/logs/
 *    coreBasic-diag5〜7-capture.txt`）。`esp_shim.c`側のタスク生成の
 *    全失敗経路（スタックサイズ拒否／スロット枯渇／acre_tsk失敗／
 *    mact_tsk失敗）に同期マーカを追加してもどれも発火しなかったことから、
 *    `osi_thread_create()`自身の中（task生成より前のsem/calloc/
 *    queue確保のいずれか）で止まっていると絞り込んだ。
 *
 *    **`AID_SEM`を一時的に旧28へ戻し（TEMP-DIAG）、`esp_shim_sem_acre_fail`／
 *    `esp_shim_sem_acre_last_ercd`を`osi_thread_create`失敗時に直読みする
 *    診断を実機で実行し、原因も確定した**: `sem_acre_fail=1`・
 *    `sem_last_ercd=-34`（`E_NOID`＝ID番号不足、`t_stddef.h`）。
 *    `stack_size`/`core`/`wqnum`/`wqlen0`はいずれも正常値だった
 *    （ガード節・スタックサイズは無関係と確定）。⇒ **`osi_sem_new()`が
 *    `acre_sem`のID枯渇で失敗している**ことを実測で確認した——上記コメント
 *    の過去事象（`esp_spp_start_srv()`到達時点・RFCOMM確立後の32枠枯渇）
 *    と同種の枯渇が、BTU_TASK生成（初期化ごく初期・3番目の
 *    `osi_thread_create`呼び出し）という遥かに早い段階で既に起きていた。
 *    `.steering/20260808-lm-d4-btclassic-cmake/logs/
 *    coreBasic-diag-semcount-capture.txt`に生ログ。
 *    ⇒ 以下の`AID_SEM(96)`（Classic限定、旧96＝当時の実測値へ復元）は
 *    **確定した修正**。他の構成（golden 5構成含む）は28のまま無改変
 *    （DRAM予算・golden byte一致を維持）。
 */
#ifdef TOPPERS_ESP32_BT_BLUEDROID_CLASSIC
AID_SEM(96);
#else
AID_SEM(28);
#endif

/*
 *  データキューの動的生成スロット予約（2026-08-04・段3）は
 *  **2026-08-15（BL-G-3 段3）に削除した**。`AID_DTQ(ESP_SHIM_NUM_DTQ)` の
 *  唯一の利用者だった `esp_shim_dtq_create()`（`esp_shim.c` のキュー実装が
 *  呼んでいた）が撤去され、この cfg にデータキューは 1 つも無くなったためである。
 *  ⇒ `_kernel_dtqcb_table` 等が丸ごと消える。復元は
