 *  フトウェアは無保証で提供される．
 *
 *  ----------------------------------------------------------------------------
 *  【この cfg が要る理由】
 *  FMP3 の CFG_INT は静的 API であり、ena_int() は check_intno_cfg() を通る
 *  （p_intcfg_table は cfg が生成する）。blob は _set_intr/_set_isr で
 *  **自分で決めた線番号**（asp3 C6 実測: 線 1）を要求し、シムはその線を
 *  ena_int() で開ける（esp_wifi_adapter.c の set_isr_wrapper）。cfg に無い
 *  線は実行時にどうやっても開けられないので、blob が選びうる 1..15 を
 *  ここで先に宣言する（計画 F3。asp3 は 1..3 だけだった）。
 *
 *  【S3/LX6 の esp_shim.cfg との関係】
 *  S3/LX6 は esp_shim.cfg 自身が CFG_INT(0..3)/DEF_INH(0..3)（と LX6 5/7/8、
 *  L3 23/27）を持つ。C6 では線 0 が存在せず（TargetCheckCfgInt が拒否）、
 *  INHNO が (PRC1 << 16) | 線 の形なので、その部分は esp_shim.cfg 側で
 *  `#ifndef TOPPERS_ESP32C6` に包み、C6 はこのファイルを cmake
 *  （cmake/a1_c6_stage1.cmake の A1_C6_WIFI ブロック）が FMP3_CFG_FILES へ
 *  足す形で置き換える（P4 の esp_shim_intr_clic.cfg と同じ足し方）。
 *
 *  【線番号をここに書かない】値は esp_shim_intr_intmtx_lines.h にしか無い
 *  （.c 側も同じヘッダを読む）。ただし cfg ファイル内では #define も
 *  マクロによる繰り返し展開もできないので、1..15 の 15 本は文字どおり
 *  並べる。lines.h の検査 (E) が「範囲を変えたらここも直せ」を #error で守る。
 *
 *  【TA_NULL（起動時は開けない）にしてある理由】P4 版と同じ。開けるのは
 *  blob が _set_isr でハンドラを登録したとき（set_isr_wrapper の ena_int）か
 *  esp_intr_alloc() のときだけ（fail-closed）。
 *
 *  【優先度 -2】S3/LX6 の esp_shim.cfg と同じ。lines.h の
 *  ESP_SHIM_INTMTX_INTR_INTPRI のコメント参照。
 *
 *  【CLASS(CLS_PRC1)】C6 は単一コア（TNUM_PRCID=1、target_kernel.h が
 *  #error で固定）。
 *  ----------------------------------------------------------------------------
 */

/*  線表（CFG_INT の intno と DEF_INH の inhno）  */
#include "esp_shim_intr_intmtx_lines.h"
/*  ハンドラ本体 esp_shim_intmtx_inthdr_n の宣言。cfg の #include は
 *  cfg1_out.c と kernel_cfg.c の両方へ伝播する（P4 版のコメント参照）。  */
#include "esp_shim_intr_intmtx.h"

CLASS(CLS_PRC1) {
	CFG_INT(1,  { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(1),  { TA_NULL, esp_shim_intmtx_inthdr_1 });
	CFG_INT(2,  { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(2),  { TA_NULL, esp_shim_intmtx_inthdr_2 });
	CFG_INT(3,  { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(3),  { TA_NULL, esp_shim_intmtx_inthdr_3 });
	CFG_INT(4,  { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(4),  { TA_NULL, esp_shim_intmtx_inthdr_4 });
	CFG_INT(5,  { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(5),  { TA_NULL, esp_shim_intmtx_inthdr_5 });
	CFG_INT(6,  { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(6),  { TA_NULL, esp_shim_intmtx_inthdr_6 });
	CFG_INT(7,  { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(7),  { TA_NULL, esp_shim_intmtx_inthdr_7 });
	CFG_INT(8,  { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(8),  { TA_NULL, esp_shim_intmtx_inthdr_8 });
	CFG_INT(9,  { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(9),  { TA_NULL, esp_shim_intmtx_inthdr_9 });
	CFG_INT(10, { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(10), { TA_NULL, esp_shim_intmtx_inthdr_10 });
	CFG_INT(11, { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
