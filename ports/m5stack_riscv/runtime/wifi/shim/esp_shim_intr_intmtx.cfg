	CFG_INT(13, { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(13), { TA_NULL, esp_shim_intmtx_inthdr_13 });
	CFG_INT(14, { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(14), { TA_NULL, esp_shim_intmtx_inthdr_14 });
	CFG_INT(15, { TA_NULL, ESP_SHIM_INTMTX_INTR_INTPRI });
	DEF_INH(ESP_SHIM_INTMTX_INHNO(15), { TA_NULL, esp_shim_intmtx_inthdr_15 });
}
