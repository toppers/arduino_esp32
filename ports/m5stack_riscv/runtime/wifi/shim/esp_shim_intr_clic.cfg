 *  フトウェアは無保証で提供される．
 *
 *  ----------------------------------------------------------------------------
 *  【この cfg が要る理由】
 *  FMP3 の `CFG_INT` は静的 API であり、`ena_int()` は `check_intno_cfg()` を
 *  通る（`p_intcfg_table` は cfg が生成する）。⇒ **cfg に無い線は実行時に
 *  どうやっても開けられない。** アロケータが払い出す線は、ここで先に宣言しておく。
 *
 *  【線番号をここに書かない】値は `esp_shim_intr_clic_lines.h` にしか無い。
 *  `.c` 側も同じヘッダを読む。Xtensa 側で「.c と .cfg の両方にベタ書きされていて
 *  実際に食い違った」事故（シム=線8／cfg=線13＝IPI）の再発防止である。
 *
 *  【`TA_NULL`（起動時は開けない）にしてある理由】
 *  確保されていない線を開けたままにすると、そこへ何かが配線された瞬間に
 *  ISR が「未確保」を見て何もせずに戻る＝レベル割込みなら storm になる。
 *  開けるのは `esp_intr_alloc()` が `ena_int()` を呼ぶときだけ（fail-closed）。
 *  `esp/eth/os/fmp3_eth_pools.cfg` が `TA_ENAINT` なのは、あちらが
 *  「1 本を静的に固定し、動的な有効/無効切替を行わない」構成だからである。
 *
 *  【トリガ型（`TA_EDGE`）を付けない理由】
 *  想定利用者（EMAC・MIPI-DSI ブリッジ・GPIO・SDMMC）はいずれも
 *  **レベル割込み**である。`TA_EDGE` を付けると `clic_set_edge()` が走り
 *  （`fmp3_core/arch/riscv_gcc/common/clic_kernel_impl.c` の `clic_config_int`）、
 *  レベル要因が 1 回しか拾われない形になる。
 *
 *  【`CLASS(CLS_PRC1)` である理由】
 *  `fmp3_core/arch/riscv_gcc/common/clic_kernel.trb` の `TargetCheckCfgInt` は、
 *  複数 PE への affinity を持つクラスの `CFG_INT` を**拒否する**。
 *  シム側も割込みマトリクスを CORE0 にしか書かないので、PRC1 固定で整合する。
 *  ----------------------------------------------------------------------------
 */

/*  線表（CFG_INT の intno と CRE_ISR の intno）  */
#include "esp_shim_intr_clic_lines.h"
/*  ISR 本体 `esp_shim_clic_intr_isr` の宣言。
 *  cfg の `#include` は cfg1_out.c **と kernel_cfg.c の両方**へ伝播する
 *  （実測: 生成物 kernel_cfg.c の「Include Directives」節に並ぶ）。
 *  ここを忘れると kernel_cfg.c 側だけが `undeclared` で落ちる。  */
#include "esp_shim_intr_clic.h"

CLASS(CLS_PRC1) {

	CFG_INT(ESP_SHIM_CLIC_INTR_LINE0, { TA_NULL, ESP_SHIM_CLIC_INTR_INTPRI });
	CRE_ISR(ESP_SHIM_CLIC_ISR0, { TA_NULL, 0, ESP_SHIM_CLIC_INTR_LINE0,
			esp_shim_clic_intr_isr, ESP_SHIM_CLIC_INTR_ISRPRI });

	CFG_INT(ESP_SHIM_CLIC_INTR_LINE1, { TA_NULL, ESP_SHIM_CLIC_INTR_INTPRI });
	CRE_ISR(ESP_SHIM_CLIC_ISR1, { TA_NULL, 1, ESP_SHIM_CLIC_INTR_LINE1,
			esp_shim_clic_intr_isr, ESP_SHIM_CLIC_INTR_ISRPRI });

	CFG_INT(ESP_SHIM_CLIC_INTR_LINE2, { TA_NULL, ESP_SHIM_CLIC_INTR_INTPRI });
	CRE_ISR(ESP_SHIM_CLIC_ISR2, { TA_NULL, 2, ESP_SHIM_CLIC_INTR_LINE2,
			esp_shim_clic_intr_isr, ESP_SHIM_CLIC_INTR_ISRPRI });

	CFG_INT(ESP_SHIM_CLIC_INTR_LINE3, { TA_NULL, ESP_SHIM_CLIC_INTR_INTPRI });
	CRE_ISR(ESP_SHIM_CLIC_ISR3, { TA_NULL, 3, ESP_SHIM_CLIC_INTR_LINE3,
			esp_shim_clic_intr_isr, ESP_SHIM_CLIC_INTR_ISRPRI });

	CFG_INT(ESP_SHIM_CLIC_INTR_LINE4, { TA_NULL, ESP_SHIM_CLIC_INTR_INTPRI });
	CRE_ISR(ESP_SHIM_CLIC_ISR4, { TA_NULL, 4, ESP_SHIM_CLIC_INTR_LINE4,
			esp_shim_clic_intr_isr, ESP_SHIM_CLIC_INTR_ISRPRI });

	CFG_INT(ESP_SHIM_CLIC_INTR_LINE5, { TA_NULL, ESP_SHIM_CLIC_INTR_INTPRI });
	CRE_ISR(ESP_SHIM_CLIC_ISR5, { TA_NULL, 5, ESP_SHIM_CLIC_INTR_LINE5,
			esp_shim_clic_intr_isr, ESP_SHIM_CLIC_INTR_ISRPRI });
}
