/*
 *  タイマドライバのコンフィギュレーションファイル
 *  （M5Stamp-C5 / ESP32-C5 用・FMP3）
 *
 *  出典: asp3_esp_idf asp3/target/esp32c5_espidf/target_timer.cfg。
 *  asp3 版の #ifdef USE_TIM_AS_HRT ガードは外し，musca_b1_gcc/target_timer.cfg
 *  と同じ CLASS(CLS_PRC1) 形式へ書き直した。
 *
 *  DEF_INH の第2要素は _kernel_target_hrt_handler（renamed 後の名前）を使う
 *  （実装計画 Task 5 のビルドで発覚）。musca_b1_gcc/target_timer.cfg は target_hrt_handler を
 *  renameしていない（target_rename.def に無い）ため生の名前のままでよいが，
 *  本ターゲットの target_rename.def は target_hrt_handler も rename 対象に
 *  加えている（Task 3）。kernel_cfg.c は kernel_int.h 経由で
 *  kernel_unrename.h -> target_unrename.h が効いた状態でコンパイルされる
 *  （target_hrt_handler の #define は #undef 済み）ため，ATT_INI/ATT_TER と
 *  同じく renamed 後の名前をここへ直接書く必要がある。
 */
#include "target_timer.h"

CLASS(CLS_PRC1) {
	ATT_INI({ TA_NULL, 0, _kernel_target_hrt_initialize });
	ATT_TER({ TA_NULL, 0, _kernel_target_hrt_terminate });
	CFG_INT(INTNO_TIMER, { TA_ENAINT|INTATR_TIMER, INTPRI_TIMER });
	DEF_INH(INHNO_TIMER_PRC1, { TA_NULL, _kernel_target_hrt_handler });
}
