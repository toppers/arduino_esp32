/*
 *  ESP32-P4 Wi-Fi モジュール対応 - lwIP sys_arch FMP3 実装
 *  静的プール cfg
 *
 *  静的プール方式（fmp3_lwip_pools.h / fmp3_lwip_pools.c の設計コメント参照）
 *  のための CRE_SEM / CRE_MTX / CRE_DTQ / CRE_TSK 群。
 *
 *  【注記】このファイルは「作るファイル」一覧には無いが、姉妹実装
 *  `os_adapter/fmp3_hosted_osi.cfg` と同様に静的プール方式には必須の cfg で
 *  あるため合わせて用意した（cfg 無しでは CRE_ 済みオブジェクトが実在せず
 *  ビルドできないため）。
 *
 *  【重要】この cfg 中の名前（FMP3_LWIP_SEM1.. 等）は、configure.rb によって
 *  kernel_id.h に ID 定数マクロとして自動生成される。fmp3_lwip_pools.c 側の
 *  同名 #ifndef フォールバック定義は、configure.rb を通さない単体構文チェック
 *  （本ポーティング作業のフェーズ0での検証手段）専用であり、実ビルドでは
 *  kernel_id.h の定義が優先される。
 *
 *  プールサイズ（fmp3_lwip_pools.h の FMP3_LWIP_POOL_NUM_*）を変更する場合は、
 *  この cfg と fmp3_lwip_pools.c 側の CRE_ 一覧／フォールバック ID 一覧の
 *  両方を手動で追加・削除し、個数を一致させること（動的に追随しない）。
 *
 *  記法は FMP3 標準の sample/sample1.cfg・os_adapter/fmp3_hosted_osi.cfg に倣った。
 */
#include "fmp3_lwip_pools.h"

/*
 *  【2026-07-10 変更・重要】クラスを CLS_ALL_PRC1（初期 PRC1・マイグレーション
 *  可）から CLS_PRC1（PRC1 固定）へ変更した。sys_arch.c の SYS_ARCH_PROTECT は
 *  loc_cpu/unl_cpu（自 PE のみ有効）で実装されており、lwIP に触れる全タスク
 *  （tcpip_thread・ドライバ rx/tx・esp-hosted プールタスク）が同一 PE 上で
 *  動くことが排他の成立条件になる。旧設定はこの前提を強制しておらず、タスクが
 *  PRC2 へ移動すると pbuf 参照カウント・memp フリーリストのクロスコア競合が
 *  成立し得た（コードレビュー指摘。os_adapter/fmp3_hosted_osi.cfg も同時に
 *  CLS_PRC1 化済み）。マルチ PE 化するにはスピンロック（loc_spn/unl_spn）
 *  ベースの protect 実装への見直しが先に必要（sys_arch.c の TODO 参照）。
 */
CLASS(CLS_PRC1) {

	/*
	 *  ---- セマフォプール (FMP3_LWIP_POOL_NUM_SEM = 16) ----
	 *  初期資源数0・最大資源数 FMP3_LWIP_SEM_STATIC_MAXCNT(=255, u8_t の
	 *  理論最大に一致) で生成。fmp3_lwip_pool_sem_new(count) が空きスロットを
	 *  1つ確保し、count 回 sig_sem して資源数を合わせる。
	 */
	CRE_SEM(FMP3_LWIP_SEM1,  { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM2,  { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM3,  { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM4,  { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM5,  { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM6,  { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM7,  { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM8,  { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM9,  { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM10, { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM11, { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM12, { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM13, { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM14, { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM15, { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });
	CRE_SEM(FMP3_LWIP_SEM16, { TA_TPRI, 0, FMP3_LWIP_SEM_STATIC_MAXCNT });

	/*
	 *  ---- ミューテックスプール (FMP3_LWIP_POOL_NUM_MUTEX = 8)
	 *       + プール管理用ミューテックス (1本) ----
	 */
	CRE_MTX(FMP3_LWIP_MTX1, { TA_NULL });
	CRE_MTX(FMP3_LWIP_MTX2, { TA_NULL });
	CRE_MTX(FMP3_LWIP_MTX3, { TA_NULL });
	CRE_MTX(FMP3_LWIP_MTX4, { TA_NULL });
	CRE_MTX(FMP3_LWIP_MTX5, { TA_NULL });
	CRE_MTX(FMP3_LWIP_MTX6, { TA_NULL });
	CRE_MTX(FMP3_LWIP_MTX7, { TA_NULL });
	CRE_MTX(FMP3_LWIP_MTX8, { TA_NULL });

	/*  各プール(sem/mutex/mbox/task)の "used" ビットマップ操作を保護する、
	 *  このモジュール専用の管理ミューテックス(1本)。 */
	CRE_MTX(FMP3_LWIP_POOL_META_MTX, { TA_NULL });

	/*
	 *  ---- メールボックスプール (FMP3_LWIP_POOL_NUM_MBOX = 12) ----
	 *  lwIP の mbox は void* 1個を運ぶだけなので、dtq 1本でそのまま実現する
	 *  （os_adapter の可変長キューのような free/filled 2本構成は不要）。
	 *  容量は FMP3_LWIP_MBOX_MAX_ELEMS に固定。TA_NULL＝FIFO順。
	 *  【2026-07-10】socket/netconn 有効化に伴い 8→12 へ増量（.h/.c と同時変更）。
	 *  MBOX9-12 はこの cfg 中で最後に宣言される DTQ なので実採番は 34-37 になる
	 *  （fmp3_lwip_pools.c のフォールバック ID と一致。build 時に自動照合される）。
	 */
	CRE_DTQ(FMP3_LWIP_MBOX1, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX2, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX3, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX4, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX5, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX6, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX7, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX8, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX9,  { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX10, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX11, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });
	CRE_DTQ(FMP3_LWIP_MBOX12, { TA_NULL, FMP3_LWIP_MBOX_MAX_ELEMS, NULL });

	/*
	 *  ---- タスクプール (FMP3_LWIP_POOL_NUM_THREAD = 8) ----
	 *  TA_NULL（非起動＝ダーマント状態）で生成し、_h_thread_create 相当の
	 *  fmp3_lwip_pool_thread_new() が act_tsk() で起動する。exinf にプール
	 *  添字（0起点）を渡し、共通トランポリン fmp3_lwip_pool_task_trampoline()
	 *  がそれを見て呼ぶべき thread_fn を引く。
	 */
	CRE_TSK(FMP3_LWIP_TSK1, { TA_NULL, 0, fmp3_lwip_pool_task_trampoline,
			FMP3_LWIP_THREAD_PRI_DEFAULT, FMP3_LWIP_THREAD_STACK_SIZE, NULL });
	CRE_TSK(FMP3_LWIP_TSK2, { TA_NULL, 1, fmp3_lwip_pool_task_trampoline,
			FMP3_LWIP_THREAD_PRI_DEFAULT, FMP3_LWIP_THREAD_STACK_SIZE, NULL });
	CRE_TSK(FMP3_LWIP_TSK3, { TA_NULL, 2, fmp3_lwip_pool_task_trampoline,
			FMP3_LWIP_THREAD_PRI_DEFAULT, FMP3_LWIP_THREAD_STACK_SIZE, NULL });
	CRE_TSK(FMP3_LWIP_TSK4, { TA_NULL, 3, fmp3_lwip_pool_task_trampoline,
			FMP3_LWIP_THREAD_PRI_DEFAULT, FMP3_LWIP_THREAD_STACK_SIZE, NULL });
	CRE_TSK(FMP3_LWIP_TSK5, { TA_NULL, 4, fmp3_lwip_pool_task_trampoline,
			FMP3_LWIP_THREAD_PRI_DEFAULT, FMP3_LWIP_THREAD_STACK_SIZE, NULL });
	CRE_TSK(FMP3_LWIP_TSK6, { TA_NULL, 5, fmp3_lwip_pool_task_trampoline,
			FMP3_LWIP_THREAD_PRI_DEFAULT, FMP3_LWIP_THREAD_STACK_SIZE, NULL });
	CRE_TSK(FMP3_LWIP_TSK7, { TA_NULL, 6, fmp3_lwip_pool_task_trampoline,
			FMP3_LWIP_THREAD_PRI_DEFAULT, FMP3_LWIP_THREAD_STACK_SIZE, NULL });
	CRE_TSK(FMP3_LWIP_TSK8, { TA_NULL, 7, fmp3_lwip_pool_task_trampoline,
			FMP3_LWIP_THREAD_PRI_DEFAULT, FMP3_LWIP_THREAD_STACK_SIZE, NULL });
}

/*
 *  システム起動時に一度だけ sys_init()（lwIP 契約側の初期化関数。
 *  fmp3_lwip_pools_init() を呼ぶ）が呼ばれる想定。sys_init() は lwIP 本体
 *  （tcpip_init 等）から呼ばれる契約なので、os_adapter の ATT_INI と異なり
 *  ここでは ATT_INI を登録しない（TODO: 統合時に呼び出し順序を再確認）。
 */
