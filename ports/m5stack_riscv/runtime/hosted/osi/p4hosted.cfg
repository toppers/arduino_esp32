/*
 *  ESP32-P4 + M5Stack Stamp-AddOn C6 (ESP-Hosted) 移植
 *  os_adapter 静的プール cfg
 *
 *  静的プール方式（p4hosted_osi.h / p4hosted_pools.c の設計コメント参照）
 *  のための CRE_TSK / CRE_SEM / CRE_MTX / CRE_DTQ / CRE_ALM 群。
 *
 *  【重要】この cfg 中の名前（HOSTED_TSK1.. 等）は、configure.rb によって
 *  kernel_id.h に ID 定数マクロとして自動生成される。p4hosted_pools.c 側の
 *  同名 #ifndef フォールバック定義は、configure.rb を通さない単体構文チェック
 *  （本ポーティング作業のフェーズ0での検証手段）専用であり、実ビルドでは
 *  kernel_id.h の定義が優先される。
 *
 *  プールサイズ（p4hosted_osi.h の HOSTED_POOL_NUM_*）を変更する場合は、
 *  この cfg と p4hosted_pools.c 側の CRE_ 一覧／フォールバック ID 一覧の
 *  両方を手動で追加・削除し、個数を一致させること（動的に追随しない）。
 *
 *  記法は FMP3 標準の sample/sample1.cfg・target/*_gcc/tools/fmp_app/fmp_app.cfg
 *  に倣った。
 */
#include "p4hosted_osi.h"
#include "p4sdio_host.h"

/*
 *  【改変 D-5（本 repo・段7b）】出典がここで宣言していた 2 つのブロックを削除した。
 *
 *  (1) SDMMC のカーネルオブジェクト（`SDMMC_SEM_EVT`/`SDMMC_SEM_IO`/`SDMMC_MTX`
 *      ＋ `CFG_INT(INTNO_SDMMC)`/`CRE_ISR`）
 *      ⇒ 本 repo では 7a の `esp/p4sdio/p4sdio.cfg` が既に作っている
 *        （`P4SDIO_SEM_EVT`/`P4SDIO_SEM_IO`/`P4SDIO_MTX`）。ここでも作ると
 *        **二重定義**になる。割込み線は C-1 CLIC シムの表
 *        （`esp/shim/esp_shim_intr_clic.cfg`）にしか書かない——7a の改変 D-3 と同じ規律で、
 *        利用者ごとに線を写すと必ず食い違う。
 *
 *  (2) ESP-IDF crosscore 割込み（絶対線 17）の引取り ISR
 *      ⇒ 改変 D-4。FreeRTOS を 1 記号もリンクしないので引取りの対象が居ない。
 */

/*
 *  【2026-07-10 変更・重要】タスク・アラームのクラスを CLS_ALL_PRC1（初期
 *  PRC1・マイグレーション可）から CLS_PRC1（PRC1 固定）へ変更した。
 *  理由: lwIP の SYS_ARCH_PROTECT（loc_cpu）・esp_event の静的レジストリ・
 *  タイマトランポリンの slot 読出しは、いずれも「関係するタスク/ハンドラが
 *  同一 PE 上で動く」ことを排他の前提にしている（loc_cpu は自 PE のみ有効）。
 *  旧設定ではこの前提を強制する構成が無く、タスクが PRC2 へ移動した瞬間に
 *  クロスコア競合（pbuf 参照カウント破壊・レジストリ読み書き競合等）が
 *  成立し得た（コードレビュー指摘）。Wi-Fi モジュール関連タスクを PRC1 に
 *  固定することで単一 PE 前提を構成レベルで保証する。マルチ PE 化する場合は
 *  スピンロック（loc_spn/unl_spn）ベースへの排他見直しが先に必要。
 */
CLASS(CLS_PRC1) {

	/*
	 *  ---- タスクプール (HOSTED_POOL_NUM_TASK = 8) ----
	 *  TA_NULL（非起動＝ダーマント状態）で生成し、_h_thread_create() が
	 *  act_tsk() で起動する。exinf にプール添字（0起点）を渡し、共通
	 *  トランポリン hosted_pool_task_trampoline() がそれを見て呼ぶべき
	 *  start_routine を引く。CRE_TSK の優先度は単なる初期値であり、
	 *  トランポリン内で chg_pri により _h_thread_create の tprio 相当へ
	 *  すぐ書き換えられる。
	 */
	CRE_TSK(HOSTED_TSK1, { TA_NULL, 0, hosted_pool_task_trampoline,
			HOSTED_POOL_TASK_PRI_DEFAULT, HOSTED_POOL_TASK_STACK_SIZE, NULL });
	CRE_TSK(HOSTED_TSK2, { TA_NULL, 1, hosted_pool_task_trampoline,
			HOSTED_POOL_TASK_PRI_DEFAULT, HOSTED_POOL_TASK_STACK_SIZE, NULL });
	CRE_TSK(HOSTED_TSK3, { TA_NULL, 2, hosted_pool_task_trampoline,
			HOSTED_POOL_TASK_PRI_DEFAULT, HOSTED_POOL_TASK_STACK_SIZE, NULL });
	CRE_TSK(HOSTED_TSK4, { TA_NULL, 3, hosted_pool_task_trampoline,
			HOSTED_POOL_TASK_PRI_DEFAULT, HOSTED_POOL_TASK_STACK_SIZE, NULL });
	CRE_TSK(HOSTED_TSK5, { TA_NULL, 4, hosted_pool_task_trampoline,
			HOSTED_POOL_TASK_PRI_DEFAULT, HOSTED_POOL_TASK_STACK_SIZE, NULL });
	CRE_TSK(HOSTED_TSK6, { TA_NULL, 5, hosted_pool_task_trampoline,
			HOSTED_POOL_TASK_PRI_DEFAULT, HOSTED_POOL_TASK_STACK_SIZE, NULL });
	CRE_TSK(HOSTED_TSK7, { TA_NULL, 6, hosted_pool_task_trampoline,
			HOSTED_POOL_TASK_PRI_DEFAULT, HOSTED_POOL_TASK_STACK_SIZE, NULL });
	CRE_TSK(HOSTED_TSK8, { TA_NULL, 7, hosted_pool_task_trampoline,
			HOSTED_POOL_TASK_PRI_DEFAULT, HOSTED_POOL_TASK_STACK_SIZE, NULL });

	/*
	 *  ---- セマフォプール (HOSTED_POOL_NUM_SEM = 16) ----
	 *  初期資源数0・最大資源数 HOSTED_SEM_STATIC_MAXCNT（固定）で生成。
	 *  _h_create_semaphore() が空きスロットを1つ確保し、直後に sig_sem を
	 *  1回呼んで資源数1にする（upstream(FreeRTOS)参照実装と同じ挙動。
	 *  p4hosted_pools.c 参照）。
	 */
	CRE_SEM(HOSTED_SEM1,  { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM2,  { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM3,  { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM4,  { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM5,  { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM6,  { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM7,  { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM8,  { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM9,  { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM10, { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM11, { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM12, { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM13, { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM14, { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM15, { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });
	CRE_SEM(HOSTED_SEM16, { TA_TPRI, 0, HOSTED_SEM_STATIC_MAXCNT });

	/*
	 *  ---- ミューテックスプール (HOSTED_POOL_NUM_MUTEX = 8)
	 *       + プール管理用ミューテックス (1本) ----
	 *  TA_NULL（優先度継承プロトコル、上限指定なし）で十分（プール管理用途、
	 *  ユーザ提供の汎用ミューテックスとも用途はシンプルな相互排他）。
	 */
	CRE_MTX(HOSTED_MTX1, { TA_NULL });
	CRE_MTX(HOSTED_MTX2, { TA_NULL });
	CRE_MTX(HOSTED_MTX3, { TA_NULL });
	CRE_MTX(HOSTED_MTX4, { TA_NULL });
	CRE_MTX(HOSTED_MTX5, { TA_NULL });
	CRE_MTX(HOSTED_MTX6, { TA_NULL });
	CRE_MTX(HOSTED_MTX7, { TA_NULL });
	CRE_MTX(HOSTED_MTX8, { TA_NULL });

	/*  各プール(task/sem/mutex/queue/timer)の "used" ビットマップ操作を
	 *  保護する、このモジュール専用の管理ミューテックス(1本)。 */
	CRE_MTX(HOSTED_POOL_META_MTX, { TA_NULL });

#ifdef H_USE_MEMPOOL
	/*  mempool ロック用（フェーズ2以降で H_USE_MEMPOOL を有効化した場合のみ
	 *  生成する。p4hosted_pools.c の hosted_pool_{lock,unlock}_mempool()
	 *  参照）。 */
	CRE_MTX(HOSTED_MEMPOOL_LOCK_MTX, { TA_NULL });
#endif

	/*
	 *  ---- データキュープール (HOSTED_POOL_NUM_QUEUE = 8) ----
	 *  1論理キューにつき dtq を2本（空きスロット用 / 格納済みスロット用）
	 *  使う。容量は両方とも HOSTED_QUEUE_MAX_ELEMS に固定する
	 *  （p4hosted_pools.c の設計コメント参照。dtq とリングバッファの
	 *  容量を一致させ、オーバーラン事故を避けるため）。
	 *  TA_NULL＝FIFO順（内部的な空き/格納スロット番号の受け渡し用なので
	 *  待ち行列順は本質的でない）。
	 */
	CRE_DTQ(HOSTED_DTQ_FREE1,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED1, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE2,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED2, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE3,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED3, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE4,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED4, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE5,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED5, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE6,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED6, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE7,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED7, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE8,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED8, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	/*  実機で判明した必要数(2026-07-09): sdio_drv.c(6)+rpc_core.c(2)+
	 *  serial_ll_if.c(1)+rpc_wrap.c(1)で計10前後を同時消費するため、8本では
	 *  不足しrpc_initがクラッシュする。余裕を見て12本とする
	 *  （p4hosted_osi.h HOSTED_POOL_NUM_QUEUE、p4hosted_pools.c の
	 *  フォールバックID一覧・g_hosted_queue_pool[] と個数を一致させること）。 */
	CRE_DTQ(HOSTED_DTQ_FREE9,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED9, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE10,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED10, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE11,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED11, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FREE12,   { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });
	CRE_DTQ(HOSTED_DTQ_FILLED12, { TA_NULL, HOSTED_QUEUE_MAX_ELEMS, NULL });

	/*
	 *  ---- タイマ(アラーム)プール (HOSTED_POOL_NUM_TIMER = 8) ----
	 *  exinf にプール添字（0起点）を渡し、共通トランポリン
	 *  hosted_pool_alarm_trampoline() が対応する timeout_handler を呼ぶ。
	 *  周期タイマは満了ハンドラ内で ista_alm により再武装する
	 *  （設計方針どおり。p4hosted_pools.c 参照）。
	 */
	CRE_ALM(HOSTED_ALM1, { TA_NULL, { TNFY_HANDLER, 0, hosted_pool_alarm_trampoline } });
	CRE_ALM(HOSTED_ALM2, { TA_NULL, { TNFY_HANDLER, 1, hosted_pool_alarm_trampoline } });
	CRE_ALM(HOSTED_ALM3, { TA_NULL, { TNFY_HANDLER, 2, hosted_pool_alarm_trampoline } });
	CRE_ALM(HOSTED_ALM4, { TA_NULL, { TNFY_HANDLER, 3, hosted_pool_alarm_trampoline } });
	CRE_ALM(HOSTED_ALM5, { TA_NULL, { TNFY_HANDLER, 4, hosted_pool_alarm_trampoline } });
	CRE_ALM(HOSTED_ALM6, { TA_NULL, { TNFY_HANDLER, 5, hosted_pool_alarm_trampoline } });
	CRE_ALM(HOSTED_ALM7, { TA_NULL, { TNFY_HANDLER, 6, hosted_pool_alarm_trampoline } });
	CRE_ALM(HOSTED_ALM8, { TA_NULL, { TNFY_HANDLER, 7, hosted_pool_alarm_trampoline } });

	/*
	 *  ---- タイマコールバックディスパッチ (2026-07-10 追加) ----
	 *  アラームハンドラ（非タスク文脈）から dtq 経由で通知を受け、esp-hosted の
	 *  タイマコールバックをタスク文脈で呼ぶ専用タスク（p4hosted_pools.c の
	 *  タイマ節の設計コメント参照）。TA_ACT でカーネル起動時から受信ループに入る。
	 */
	CRE_TSK(HOSTED_TMR_TSK, { TA_ACT, 0, hosted_pool_timer_dispatch_task,
			HOSTED_TMR_DISPATCH_PRI, HOSTED_TMR_DISPATCH_STACK_SIZE, NULL });
	CRE_DTQ(HOSTED_TMR_DTQ, { TA_NULL, HOSTED_TMR_DTQ_CAPACITY, NULL });
}

/*
 *  システム起動時に一度だけ p4hosted_osi_init() を呼ぶ（g_h の設定・
 *  起動ログ出力）。syssvc/serial.cfg の ATT_INI パターンに倣った。
 */
ATT_INI({ TA_NULL, 0, p4hosted_osi_init });
