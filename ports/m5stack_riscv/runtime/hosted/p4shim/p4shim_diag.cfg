/*
 *  seam 版 Ethernet の診断タスク（段 E-seam・2026-08-15）
 *  ============================================================================
 *  判定アプリ `esp/eth/app/fmp_eth_sta/fmp_eth_sta.cfg`（取込み層）を
 *  **1 バイトも変えずに**、seam でしか測れないもの（I-6/I-7/I-10/I-12）を
 *  出すためのタスク。CMake の `A1_P4_SEAM_ETH` ブロックが
 *  `FMP3_CFG_FILES` へ足す（アプリの .cfg より前に読まれる）。
 *
 *  【優先度】測ることで測られる側を乱さないよう**最低優先**にする。
 *  eth 側は tcpip_thread=9 / RX=11 / rxpoll=12 / timer=13 を使うので 14。
 *
 *  【CLASS】C-1 のシムと eth のプール群に合わせて CLS_PRC1 固定。
 */
#include <kernel.h>
#include "p4shim_diag.h"

CLASS(CLS_PRC1) {
	CRE_TSK(P4SHIM_DIAG_TASK, { TA_ACT, 0, p4shim_diag_task,
			P4SHIM_DIAG_PRI, P4SHIM_DIAG_STACK, NULL });
}
