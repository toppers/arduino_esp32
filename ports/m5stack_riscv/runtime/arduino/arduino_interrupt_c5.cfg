/*
 *  attachInterrupt: interrupt configuration (ESP32-C5)
 *
 *  ESP32-C5 (ports/m5stack_riscv, C5 plan A3) version of
 *  arduino_interrupt.cfg (C6): CFG_INT the line, enable a dynamic ISR
 *  (acre_isr) on it, reserve one ISR id. The GPIO source
 *  (ETS_GPIO_INTR_SOURCE) is routed to the line at run time by
 *  arduino_interrupt_c5.c through the kernel's esp32c5_intmtx_route().
 *
 *  Why line 23: see arduino_interrupt_c5.h. No TA_EDGE: the line must stay
 *  level-triggered for the GPIO status dispatch loop (a software-raised
 *  edge line is what the kernel tests use on 18/20/21; this is not one).
 *
 *  ENA_DYNISR goes inside the same CLASS block as CFG_INT (class-scoped
 *  API); AID_ISR is class-external and is written below. AID_ISR(n>0)
 *  requires at least one static CRE_ISR somewhere in the configuration,
 *  which the console's chip_serial.cfg (CRE_ISR(ISR_SIO)) satisfies for
 *  every profile. DEF_INH and ENA_DYNISR cannot share a line: do not write
 *  a DEF_INH for 23.
 */

#include "arduino_interrupt_c5.h"

CLASS(CLS_PRC1) {

CFG_INT(ARD_GPIO_INTNO, { TA_ENAINT, ARD_GPIO_INTPRI });
ENA_DYNISR(ARD_GPIO_INTNO);

}

/*
 *  Dynamic ISR budget (class-external API). attachInterrupt uses one shared
 *  dispatch ISR; the per-pin fan-out is a callback table in
 *  arduino_interrupt_c5.c.
 */
AID_ISR(1);
