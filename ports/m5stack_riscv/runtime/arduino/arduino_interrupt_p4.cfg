/*
 *  attachInterrupt: interrupt configuration (ESP32-P4)
 *
 *  ESP32-P4 (ports/m5stack_riscv, StampP4 plan stage B2c) version of
 *  arduino_interrupt.cfg (C6) / arduino_interrupt_c5.cfg (C5): CFG_INT the
 *  line, enable a dynamic ISR (acre_isr) on it, reserve one ISR id. The
 *  GPIO source (ETS_GPIO_INTR0_SOURCE) is routed to the line at run time
 *  by arduino_interrupt_p4.c, which writes INTMTX_MAP the way
 *  wifi/shim/esp_shim_intr_clic.c does (the P4 chip layer exports no route
 *  function of its own - unlike the C6 and C5, whose ports have one).
 *
 *  Why line 23: see arduino_interrupt_p4.h. No TA_EDGE: the line must stay
 *  level-triggered for the GPIO status dispatch loop.
 *
 *  ENA_DYNISR goes inside the same CLASS block as CFG_INT (class-scoped
 *  API); AID_ISR is class-external and is written below. AID_ISR(n>0)
 *  requires at least one static CRE_ISR somewhere in the configuration,
 *  which the console's chip_serial.cfg (CRE_ISR(ISR_SIO)) satisfies for
 *  every profile - and the CLIC shim adds six more here. DEF_INH and
 *  ENA_DYNISR cannot share a line: do not write a DEF_INH for 23.
 *
 *  CLS_PRC1 because the Arduino task runs there (the P4 is the first
 *  two-core chip of this port; CLS_PRC2 only runs the alive task).
 */

#include "arduino_interrupt_p4.h"

CLASS(CLS_PRC1) {

CFG_INT(ARD_GPIO_INTNO, { TA_ENAINT, ARD_GPIO_INTPRI });
ENA_DYNISR(ARD_GPIO_INTNO);

}

/*
 *  Dynamic ISR budget (class-external API). attachInterrupt uses one shared
 *  dispatch ISR; the per-pin fan-out is a callback table in
 *  arduino_interrupt_p4.c.
 */
AID_ISR(1);
