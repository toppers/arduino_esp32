/*
 *  attachInterrupt: interrupt configuration (ESP32-C6)
 *
 *  ESP32-C6 (ports/m5stack_riscv) version of
 *  ports/m5stack_xtensa/runtime/arduino/arduino_interrupt.cfg: CFG_INT the
 *  line, enable a dynamic ISR (acre_isr) on it, reserve one ISR id. The
 *  GPIO source (ETS_GPIO_INTR_SOURCE) is routed to the line at run time by
 *  arduino_interrupt.c through the kernel's esp32c6_intmtx_route().
 *
 *  Why line 19: see arduino_interrupt.h.
 *
 *  ENA_DYNISR goes inside the same CLASS block as CFG_INT (class-scoped
 *  API); AID_ISR is class-external and is written below. AID_ISR(n>0)
 *  requires at least one static CRE_ISR somewhere in the configuration,
 *  which the console's chip_serial.cfg (CRE_ISR(ISR_SIO)) satisfies for
 *  every profile. DEF_INH and ENA_DYNISR cannot share a line: do not write
 *  a DEF_INH for 19.
 */

#include "arduino_interrupt.h"

CLASS(CLS_PRC1) {

CFG_INT(ARD_GPIO_INTNO, { TA_ENAINT, ARD_GPIO_INTPRI });
ENA_DYNISR(ARD_GPIO_INTNO);

}

/*
 *  Dynamic ISR budget (class-external API). attachInterrupt uses one shared
 *  dispatch ISR; the per-pin fan-out is a callback table in
 *  arduino_interrupt.c.
 */
AID_ISR(1);
