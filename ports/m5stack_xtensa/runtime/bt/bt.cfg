/*
 *  Bluetooth統合（Phase D-1）の静的オブジェクト（bt_cfg.hと一致させること）
 *
 *  2026-07-17訂正：旧記述「ESP32-S3: PRC_NUM=2運用」は誤り（2026-07-08時点、
 *  当時の唯一のBLEビルド経路だったDEPRECATED版build_ble_xip.sh(PRC_NUM=2既定)
 *  に基づく記述が、seam-S3標準化後に陳腐化して残ったもの）。
 *  現行標準ビルド（build_seam_s3_ble_esp32s3.sh 等）はいずれもPRC_NUM=1
 *  （シングルコア）が既定であり、PRC_NUM=1下では
 *  arch/xtensa_gcc/esp32s3/chip_ipi.c が丸ごと `#if TNUM_PRCID >= 2` の
 *  外に落ちるためIPI層自体がバイナリに存在しない。
 *
 *  下のCLS_ALL_PRC1（BTタスクをコア0へ集約する指定）はPRC_NUM値に依らず
 *  安全側の指定として維持する：仮に将来PRC_NUM=2でビルドする場合でも
 *  BT/Wi-Fi/shim関連タスクは全てCLS_ALL_PRC1/CLS_PRC1（コア0固定）という
 *  運用規約（esp_shim.c:185-193参照）でありcross-core dispatch IPIの
 *  発生源にならない（詳細
 *  非公開作業記録/20260717-s3-ipi-backoff-design/README.md §15.2(e)）。
 */
#include "bt_cfg.h"

/*
 *  2026-07-27 レビュー esp-2：BT_TIMER_SEM／BT_TIMER_TSK（esp_timer_*
 *  ディスパッチ用のセマフォとタイマタスク）は，Wi-Fi 構成でも本物の
 *  esp_timer が必要になったため esp/shim/esp_shim.cfg へ移した
 *  （ESP_TIMER_SEM／ESP_TIMER_TSK．クラス CLS_ALL_PRC1 のまま）。
 *  実装も esp/bt/bt_shim.c から esp/shim/esp_timer_shim.c へ切り出し済み。
 *
 *  本ファイルは現在 BT 固有の静的オブジェクトを持たないが，将来の
 *  BT 専用オブジェクトの置き場として，また各 app cfg の
 *  INCLUDE("bt.cfg") を変えずに済むよう残置する。
 */

/*
 *  BT 割込みの発火状況を、ブロックされたタスクと独立に見るための周期ハンドラ
 *  （bt_intr_probe.c）。-DTOPPERS_BT_INTR_PROBE でのみ入る。
 *
 *  esp_bt_controller_enable() が返らない間、Arduino タスクは setup() の中で
 *  止まっていて何も出せない。ルーティング・INTENABLE・DPORT の保留状態・
 *  発火回数を見るにはこれしか手が無い。
 */
#ifdef TOPPERS_BT_INTR_PROBE
CLASS(CLS_PRC1) {
CRE_CYC(BT_INTR_PROBE_CYC,
        { TA_STA, { TNFY_HANDLER, 0, bt_intr_probe_cyc }, 2000000, 0 });
}
#endif
