#include "target_timer.h"

/*
 * ESP32-S3向け（単一コアのみ、CCOMPARE0はVECBASE非変更・XTOS APIで
 * ハンドラ登録するため、CFG_INT/DEF_INH（cfgプロセッサ生成の割込み
 * ベクタテーブルエントリ）は使わない。ハンドラ登録は
 * target_hrt_initialize()内で_xtos_set_interrupt_handler()を直接呼んで
 * 行う。
 */
CLASS(CLS_PRC1) {
    ATT_INI({ TA_NULL, 0, _kernel_target_hrt_initialize });
    ATT_TER({ TA_NULL, 0, _kernel_target_hrt_terminate });
}
#if TNUM_PRCID >= 2
/*
 * per-core tick：コア1(PRC2)も自コアのCCOMPARE0を有効化する。
 * target_hrt_initializeは_xtos_ints_onで自コアのINTENABLEを操作するため、
 * 各コアで実行すれば各コアのtickが独立に発火する。
 */
CLASS(CLS_PRC2) {
    ATT_INI({ TA_NULL, 0, _kernel_target_hrt_initialize });
    ATT_TER({ TA_NULL, 0, _kernel_target_hrt_terminate });
}
#endif /* TNUM_PRCID >= 2 */
