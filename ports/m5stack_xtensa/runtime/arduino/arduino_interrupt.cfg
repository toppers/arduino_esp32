/*
 *  attachInterrupt 用の割込み設定
 *
 *  ESP32-S3 の GPIO 割込みソース（ETS_GPIO_INTR_SOURCE）を CPU 割込み線 18 へ
 *  配線し、そこへ動的 ISR（acre_isr）を載せる。実体は arduino_interrupt.c。
 *
 *  ★線 18 を選んだ理由（本ポートで実測した使用状況）:
 *      17 … USJ コンソール（USART_INTNO）
 *      13 … IPI（XT_IPI_INTNUM）
 *       6 … tick（XT_TIMER_INTNUM）
 *      0,1,2,3,5,7,8,23,27 … Wi-Fi シム（esp_shim.cfg が DEF_INH で占有）
 *    18 は空いており、EXTERN_LEVEL・レベル1 である。レベル線なので
 *    ディスパッチは「status 読み→クリア→配送」の単純な形でよい
 *    （EDGE 線だとクリアと配送の順序設計が要る）。
 *    値は arduino_interrupt.c が #error で機械照合するので、
 *    ここを変えて向こうを直し忘れるとビルドが止まる。
 *
 *  ★ENA_DYNISR は CFG_INT と同じクラスの囲みの中に置く（クラス内 API）。
 *    AID_ISR はクラス外専用なので下に分けて書く。
 *
 *  ★AID_ISR(n>0) は「同じオブジェクト種の静的生成が 1 個以上あること」を
 *    要求する。これは chip_serial.cfg の CRE_ISR(ISR_SIO) が満たす
 *    （全 profile がリンクする基盤なので、ここでガードを新設しなくてよい）。
 *
 *  ★DEF_INH と ENA_DYNISR は同じ割込み番号に同居できない。18 には
 *    DEF_INH を書かないこと。
 */

#include "arduino_interrupt.h"

CLASS(CLS_PRC1) {

CFG_INT(ARD_GPIO_INTNO, { TA_ENAINT, ARD_GPIO_INTPRI });
ENA_DYNISR(ARD_GPIO_INTNO);

}

/*
 *  動的 ISR の上限（クラス外専用 API）
 *
 *  attachInterrupt が使うのは共有ディスパッチ ISR 1 本だけである
 *  （ピンごとの振り分けは arduino_interrupt.c のコールバック表が行う）。
 *  1 本だけ宣言する。
 */
AID_ISR(1);
