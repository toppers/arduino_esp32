/*
 *  プロセッサ間割込み（IPI）のチップ依存部コンフィギュレーション（ESP32-S3）
 *  ipi_initializeを各コアのinirtnとして登録（自コアのFROM_CPU受信設定）。
 */
#include "chip_ipi.h"

#if TNUM_PRCID >= 2
CLASS(CLS_PRC1) {
    ATT_INI({ TA_NULL, 0, ipi_initialize });
}
CLASS(CLS_PRC2) {
    ATT_INI({ TA_NULL, 0, ipi_initialize });
}
#endif /* TNUM_PRCID >= 2 */
