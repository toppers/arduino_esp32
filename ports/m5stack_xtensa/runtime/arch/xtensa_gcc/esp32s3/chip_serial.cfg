/*
 * シリアルインタフェースドライバのチップ依存部（ESP32-S3用）のコン
 * フィギュレーションファイル（非TECS版専用）
 *
 * SIOドライバの初期化/終了ルーチンと、UART0割込み（割込みマトリクスで
 * CPU割込みINT5=USART_INTNOへ配線）に対するISR(sio_isr)を登録する。
 * CFG_INT/CRE_ISRは本ポートの割込み管理機構（core_kernel_impl.c、
 * _kernel_l1int_dispatchのdemux）でディスパッチする。CLS_SERIALは
 * CLS_PRC1（コア0。target_syssvc.hで定義）。
 */

#include "target_serial.h"
ATT_INI({ TA_NULL, 0, sio_initialize });
ATT_TER({ TA_NULL, 0, sio_terminate });
CLASS(CLS_SERIAL) {
    CFG_INT(USART_INTNO, { TA_ENAINT, USART_INTPRI });
    CRE_ISR(ISR_SIO, { TA_NULL, SIOPID_FPUT - 1, USART_INTNO, sio_isr, USART_ISRPRI });
}
