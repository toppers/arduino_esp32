/*
 *  Wi-Fi os_adapter shimの静的プール（esp_shim_cfg.hと一致させること）
 */
#include "esp_shim_cfg.h"

/*  SHIM_TA_FPU は esp_shim_cfg.h で定義（無印ESP32=TA_FPU / それ以外=TA_NULL）。
 *  cfgファイル内には #define を書けないためヘッダで定義。 */
CLASS(CLS_PRC1) {

/*
 *  セマフォ — 動的生成へ移した
 *
 *  実体は AID_SEM()（このブロックの外・ファイル末尾）＋ acre_sem / del_sem
 *  （wifi/shim/esp_shim_sem.c）。かつてここに在った
 *  CRE_SEM(SHIM_SEM1..96)（構成により 24/28/96 本が有効）はプールごと廃止した。
 *
 *  mtx（段1）と違いガード用の CRE_SEM を新設していない。AID_SEM(n>0) が
 *  要求する「同じオブジェクト種の静的生成が cfg 内に 1 個以上あること」は、
 *  下の SHIM_TIMER_SEM と SHIM_QSEM で既に満たされている。
 *  どちらもシム自身の固定インフラなので静的のまま残す
 *  （個数を誰が決めるかが違う。SHIM_QSEM はキュー実装の一部で、
 *   キューをどうするかは段3で決める）。
 */

/*
 *  タイマタスクの起床用セマフォ
 */
CRE_SEM(SHIM_TIMER_SEM, { TA_NULL, 0, 1 });

/*
/*
 *  ミューテックス — 動的生成へ移した
 *
 *  実体は AID_MTX()（このブロックの外・ファイル末尾）＋ acre_mtx / del_mtx
 *  （wifi/shim/esp_shim_mtx.c）。かつてここに在った CRE_MTX ×20
 *  （構成により 8/12/16 本が有効）はプールごと廃止した。
 *
 *  下の 1 本だけは残す必要がある。AID_MTX(n>0) は「同じオブジェクト種の
 *  静的生成が cfg 内に 1 個以上あること」を要求し、無ければ cfg エラーになる
 *  （fmp3_core の kernel.py と docs/dynamic-creation.md §2.1）。
 *
 *  このミューテックスはシムから一度も使われない。使わないことが正しい——
 *  使うと静的経路と動的経路の二本立てになる。
 */
CRE_MTX(SHIM_MTX_AID_GUARD, { TA_NULL });

/*
 *  イベントフラグプール（W3④ SPP：btc_spp.cのtx_event_group専用．
 *  esp_shim_cfg.hのESP_SHIM_NUM_FLGと一致させること）
 */
#ifdef TOPPERS_ESP32_BT_BLUEDROID_CLASSIC
CRE_FLG(SHIM_FLG1, { TA_NULL, 0 });
CRE_FLG(SHIM_FLG2, { TA_NULL, 0 });
#endif

/*
 *  キュープール（itemはヒープ確保しポインタを流す）
 */
CRE_DTQ(SHIM_DTQ1, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ2, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ3, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ4, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
#if defined(TOPPERS_BT_HOST_NIMBLE) || defined(TOPPERS_ESP32_BT_BLUEDROID_CLASSIC)
CRE_DTQ(SHIM_DTQ5, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ6, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ7, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ8, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
#endif
#ifdef TOPPERS_ESP32_BT_BLUEDROID_CLASSIC
CRE_DTQ(SHIM_DTQ9,  { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ10, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ11, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ12, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ13, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ14, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ15, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
CRE_DTQ(SHIM_DTQ16, { TA_NULL, ESP_SHIM_DTQ_CNT, NULL });
#endif

/*
 *  キュー毎の「空きスロット数」カウンティングセマフォ（SHIM_DTQ1..8と1:1対応）。
 *  esp_shim_queue_send()がesp_shim_queue_create()時のdepthを初期値として
 *  twai_semで資源トークンを取得してからshim_que_slot_allocを呼ぶことで，
 *  固定サイズスロットプール枯渇時でも呼出し元のタイムアウト指定
 *  （portMAX_DELAY等）を正しく尊重できるようにする（BT-4調査 §8.5/§10の
 *  バグ修正．NimBLEのnpl_freertos_eventq_put→xQueueSendToBack→
 *  esp_shim_queue_send経路が固定プール枯渇時に即失敗しBLE_LL_ASSERTを
 *  誘発していた問題への対処）。WiFiビルドでもキューは使われるため
 *  TOPPERS_BT_HOST_NIMBLE限定にせず，SHIM_DTQ1..4は常時，SHIM_DTQ5..8は
 *  NimBLEビルド限定でDTQと同じゲーティングにする。
 */
CRE_SEM(SHIM_QSEM1, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM2, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM3, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM4, { TA_NULL, 0, TMAX_MAXSEM });
#if defined(TOPPERS_BT_HOST_NIMBLE) || defined(TOPPERS_ESP32_BT_BLUEDROID_CLASSIC)
CRE_SEM(SHIM_QSEM5, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM6, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM7, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM8, { TA_NULL, 0, TMAX_MAXSEM });
#endif
#ifdef TOPPERS_ESP32_BT_BLUEDROID_CLASSIC
CRE_SEM(SHIM_QSEM9,  { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM10, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM11, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM12, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM13, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM14, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM15, { TA_NULL, 0, TMAX_MAXSEM });
CRE_SEM(SHIM_QSEM16, { TA_NULL, 0, TMAX_MAXSEM });
#endif

/*
 *  タスクプール（共通エントリ・exinf=スロット番号）
 *
 *  SHIM_TSK1のみ、TOPPERS_BT_HOST_NIMBLEビルドに限り高優先度
 *  （ESP_SHIM_BT_CTRL_TASK_PRI、SHIM_TIMER_TSKと同格）で静的生成する。
 *  esp_shim_task_create()（esp_shim.c）がBTコントローラ級タスク
 *  （freertos_prio>=ESP_SHIM_BT_CTRL_FREERTOS_PRIO_MIN）専用にこのスロットを
 *  優先的に割り当てる。詳細はesp_shim_cfg.hのコメント参照（BT-4調査）。
 *  WiFiビルド・bt_smoke（TOPPERS_BT_HOST_NIMBLE未定義）では従来通り
 *  ESP_SHIM_WIFI_TASK_PRIのまま＝非退行。
 */
/*
 *  タスク — 動的生成へ移した
 *
 *  実体は AID_TSK()（このブロックの外・ファイル末尾）＋
 *  acre_tsk / mact_tsk / del_tsk（wifi/shim/esp_shim_tsk.c）。
 *  かつてここに在った CRE_TSK(SHIM_TSK1..8)（構成により 6／8 本が有効）は
 *  プールごと廃止した。
 *
 *  スタックはシムが供給する（案B）。esp_shim_tsk.c の
 *  shim_tsk_stack[ESP_SHIM_NUM_TSK][] が、ここが生成していた
 *  _kernel_stack_SHIM_TSK1..8 と同じ本数・同じサイズを持つ。
 *  カーネルメモリプール（DEF_MPK）は使わない（stk != NULL なので
 *  TA_MEMALLOC が立たない）。
 *
 *  構成ごとの優先度分岐（index0 だけ BT コントローラ級）は消えていない——
 *  esp_shim.c の shim_tsk_slot_pri() が同じ分岐を持ち、acre_tsk の
 *  itskpri として実行時に渡す。TA_FPU も SHIM_TA_FPU をそのまま渡す。
 *
 *  ガード用の CRE_TSK は新設していない。AID_TSK(n>0) が要求する
 *  「同じ種の静的生成が1個以上」は下の SHIM_TIMER_TSK で満たされる
 *  （シム自身の固定インフラなので静的のまま残す）。
 */

/*
 *  ets_timerディスパッチ用タイマタスク
 */
CRE_TSK(SHIM_TIMER_TSK, { SHIM_TA_FPU, 0, esp_shim_timer_task, ESP_SHIM_TIMER_TASK_PRI, 4096, NULL });

/*
 *  Wi-Fi用CPU割込み線（blobが_set_intr/_set_isrで使用する線．
 *  実際に使われる線番号は実機ログで確認し，必要なら追加する）
 */
CFG_INT(0, { TA_NULL, -2 });
DEF_INH(0, { TA_NULL, esp_shim_inthdr_0 });
CFG_INT(1, { TA_NULL, -2 });
DEF_INH(1, { TA_NULL, esp_shim_inthdr_1 });
CFG_INT(2, { TA_NULL, -2 });
DEF_INH(2, { TA_NULL, esp_shim_inthdr_2 });
CFG_INT(3, { TA_NULL, -2 });
DEF_INH(3, { TA_NULL, esp_shim_inthdr_3 });

/*
 *  無印ESP32 BTコントローラblobがxt_set_interrupt_handler()で動的に使う
 *  CPU割込み線5・7・8（2026-07-15、W3実機トレースで確認。esp_shim_cfg.h
 *  ESP_SHIM_MAX_WIFI_INTNO=27のコメントが明記する「blobは1〜15を動的に
 *  使う」の実例。他のblobが将来別の1〜15番台の線を選ぶ可能性もあるため、
 *  0-3と同型のディスパッチ入口を用意しておく）。
 *
 *  ★S3非回帰ガード：無印ESP32（TOPPERS_ESP32_LX6）専用。ESP32-S3では
 *  USART_INTNO=5が既定（target_serial.h）で、この線5登録がCFG段階で
 *  「intno 5 duplicated」衝突を起こしBLEビルドが失敗するため除外する。
 *  無印ESP32はUARTを線17/18へ移しており線5が空くので有効。
 */
#ifdef TOPPERS_ESP32_LX6
CFG_INT(5, { TA_NULL, -2 });
DEF_INH(5, { TA_NULL, esp_shim_inthdr_5 });
CFG_INT(7, { TA_NULL, -2 });
DEF_INH(7, { TA_NULL, esp_shim_inthdr_7 });
CFG_INT(8, { TA_NULL, -2 });
DEF_INH(8, { TA_NULL, esp_shim_inthdr_8 });
#endif

/*
 *  BTコントローラのLevel-3割込み用CPU割込み線（BT-4調査）。
 *  ESP32-S3のハードウェア固定レベル3対応番号{11,15,22,23,27,29}のうち、
 *  11/15/29はESP-IDF実機でESP_CPU_INTR_DESC_FLAG_SPECIAL（内部profiling/
 *  timer1/sw1予約）、22はEDGE型のため、LEVEL型で汎用に使える23・27を
 *  bt_shim.cのesp_intr_alloc()が明示的に配線する
 *  （.claude/plans/sparkling-forging-taco.md参照）。
 */
CFG_INT(23, { TA_NULL, -2 });
DEF_INH(23, { TA_NULL, esp_shim_inthdr_23 });
CFG_INT(27, { TA_NULL, -2 });
DEF_INH(27, { TA_NULL, esp_shim_inthdr_27 });
#ifdef TOPPERS_ESP32_BT_BLUEDROID_CLASSIC
/*  CPU 割込み 29 = Xtensa SW1。ESP32 の BT コントローラが内部ソース
 *  ETS_INTERNAL_SW1_INTR_SOURCE(-5) として要求する。宣言が無いと
 *  ena_int(29) が失敗し、コントローラの起動が完了しない。 */
CFG_INT(29, { TA_NULL, -2 });
DEF_INH(29, { TA_NULL, esp_shim_inthdr_29 });
#endif

}

/*
 *  動的ミューテックスの上限（クラス外専用 API）
 *
 *  ESP_SHIM_NUM_MTX は esp_shim_cfg.h が構成ごとに 8/12/16 と決める。
 *  静的プールと同じ本数を動的側の上限として宣言する。
 */
AID_MTX(ESP_SHIM_NUM_MTX);

/*
 *  動的セマフォの上限（クラス外専用 API）
 *
 *  ESP_SHIM_NUM_SEM は esp_shim_cfg.h が構成ごとに 24/28/96 と決める。
 *  静的プールと同じ本数を動的側の上限として宣言する。
 */
AID_SEM(ESP_SHIM_NUM_SEM);

/*
 *  動的タスクの上限（クラス外専用 API）
 *
 *  ESP_SHIM_NUM_TSK は esp_shim_cfg.h が構成ごとに 6/8 と決める。
 *  静的プールと同じ本数を動的側の上限として宣言する。
 */
AID_TSK(ESP_SHIM_NUM_TSK);
