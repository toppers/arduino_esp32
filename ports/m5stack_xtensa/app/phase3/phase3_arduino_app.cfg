INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "phase3_arduino_app.h"

CLASS(CLS_PRC1) {
    CRE_TSK(ARDUINO_TASK, {
        TA_ACT | TA_FPU,
        0,
        toppers_arduino_task,
        ARDUINO_TASK_PRIORITY,
        ARDUINO_TASK_STACK_SIZE,
        NULL
    });

    /*
     *  ★かつてここに CRE_SEM(M5_SEM1..4) があったが削除した。
     *
     *  「後で M5 が使えるように ID を確保しておく」という趣旨だったが、
     *  minimal profile は m5/shim/m5_kernel_shim.c をそもそもリンクしない
     *  （objects.rsp で確認できる）。加えてシムのセマフォは
     *  動的生成（AID_SEM ＋ acre_sem）へ移ったので、この 4 本は
     *  参照されないまま SEMCB を 4 個占めるだけになっていた。
     */

    /*
     *  ★スケッチから使うカーネルオブジェクト（例題 Fmp3Sample1）。
     *
     *  周期通知とアラーム通知は**静的に**作る。動的生成（acre_cyc /
     *  acre_alm）にしたかったが、`AID_CYC(n>0)` / `AID_ALM(n>0)` は
     *  「同じ種の静的生成が 1 個以上あること」を要求し、この profile には
     *  元々 1 個も無かった（実測: cfg が
     *  `E_OBJ: AID_CYC requires at least one CRE_CYC in the system` で止まる）。
     *  ⇒ ダミーを置くくらいなら、例題がそのまま使う 1 個ずつを置く。
     *  通知先はラッパ（arduino_kernel_api.c）で、そこからスケッチが登録した
     *  コールバックを呼ぶ。登録が無ければ何もしない。
     *
     *  周期は 1 秒固定。静的な周期通知の周期を後から変える API は無い。
     */
    CRE_CYC(SAMPLE_CYC, { TA_NULL,
        { TNFY_HANDLER, PRC1, toppers_fmp3_sample_cyclic }, 1000000, 0 });
    CRE_ALM(SAMPLE_ALM, { TA_NULL,
        { TNFY_HANDLER, PRC1, toppers_fmp3_sample_alarm } });
}

/*
 *  ★タスクだけは動的生成にする。スタックは**スケッチが渡す**ので、この
 *  API を使わないスケッチは RAM を払わない（minimal は全 8 板の既定
 *  profile なので、ここに固定のスタックを置くと全員が払う）。
 *  AID_TSK は静的生成が既に在る（ARDUINO_TASK）ので追加の器は要らない。
 *  3 本は例題 Fmp3Sample1 の縮約版（sample1 は 31 本）に合わせた数である。
 */
AID_TSK(3);
