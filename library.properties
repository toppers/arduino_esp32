sentence=TOPPERS/FMP3 runtime integration for M5Stack CoreS3, M5StickS3, M5Stack Basic and M5NanoC6
paragraph=Provides an Arduino sketch bridge and a dedicated Arduino board integration that builds sketches as TOPPERS/FMP3 applications, for four boards: M5Stack CoreS3 and M5StickS3 (ESP32-S3, Xtensa LX7), M5Stack Basic (ESP32, Xtensa LX6), and M5NanoC6 (ESP32-C6, RISC-V; Minimal and WiFi runtimes only). The headers still carry CoreS3 in their names, because sketches include those by name.
category=Device Control
