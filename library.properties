paragraph=Provides an Arduino sketch bridge and a dedicated Arduino board integration that builds sketches as TOPPERS/FMP3 applications, for two boards: M5Stack CoreS3 (ESP32-S3, Xtensa LX7) and M5Stack Basic (ESP32, Xtensa LX6). The library name still says CoreS3 because renaming it would move the examples and break sketches that reference it.
