sentence=TOPPERS/FMP3 runtime integration for M5Stack CoreS3, M5StickS3, M5AtomS3 Lite, M5Stack Basic, M5Stack ATOM Lite, M5NanoC6 and M5Stamp-C5
paragraph=Provides an Arduino sketch bridge and a dedicated Arduino board integration that builds sketches as TOPPERS/FMP3 applications, for seven boards: M5Stack CoreS3, M5StickS3 and M5AtomS3 Lite (ESP32-S3, Xtensa LX7), M5Stack Basic and M5Stack ATOM Lite (ESP32, Xtensa LX6), M5NanoC6 (ESP32-C6, RISC-V) and M5Stamp-C5 (ESP32-C5, RISC-V); the boards without an LCD offer no M5Unified runtime (M5AtomS3 Lite, M5NanoC6 and M5Stamp-C5: Minimal and WiFi; M5Stack ATOM Lite: Minimal, WiFi and Bluetooth Classic, not yet run on hardware). The headers still carry CoreS3 in their names, because sketches include those by name.
category=Device Control
url=https://github.com/toppers/arduino_esp32
architectures=esp32
includes=ToppersFMP3_M5CoreS3.h,ToppersFMP3_WiFi.h
depends=M5Unified (=0.2.20), M5GFX (=0.2.27)
