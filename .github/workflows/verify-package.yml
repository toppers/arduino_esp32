# Verify the Boards Manager package on macOS and Linux.
#
# The package is verified on Windows by hand: every runtime profile installs
# through Boards Manager and builds to binaries byte-identical to the
# development install. This workflow does the same check on the OSes that
# cannot be reached from the development machine.
#
# Why it is split into two jobs:
#
#   package  Producing the prebuilt stages needs CMake, Ninja and the FMP3
#            build, and the scripts that drive it are PowerShell with Windows
#            paths. It runs on Windows, exactly as a release would.
#   verify   The platform archive is host-independent - the stage manifests
#            carry only relative paths - so the only host-dependent piece is
#            the frozen link driver, which each verify job builds for itself.
#
# Run it from the Actions tab (workflow_dispatch). It is not on push/PR because
# macOS runners are billed at a multiple of Linux minutes on private
# repositories, and this is a release-time check rather than a per-commit one.

name: verify-package

on:
  workflow_dispatch:
    inputs:
      version:
        #  Empty means library.properties decides. A literal default here was a
        #  second place to remember on a version bump, and getting it wrong
        #  builds a package labelled with one version that bundles another.
        description: 'Platform version to package (blank: use library.properties)'
        required: false
        default: ''

env:
  M5STACK_INDEX: https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
  CORE_VERSION: 3.3.8
  #  Pinned because the m5-unified stage is compiled against these sources; a
  #  different version can add calls the stage does not resolve (M5Unified
  #  0.2.20 added adc_oneshot_del_unit, which needed a new stub).
  M5GFX_VERSION: 0.2.27
  M5UNIFIED_VERSION: 0.2.20

jobs:
  package:
    #
    #  Builds the platform both boards ship in.
    #
    #  This job used to run on Windows and drive New-Fmp3PrebuiltStages.ps1 and
    #  Install-ArduinoIdeIntegration.ps1. Those are PowerShell reimplementations
    #  of build_prebuilt_stages.py and install_platform.py, and only the Python
    #  pair learned to handle two chips - install_platform.py's own header has
    #  said for a while that the two of them are everything this job does and
    #  that it no longer needs a Windows runner. Doing the second board twice,
    #  in a language the maintainers cannot run outside CI, is how the two
    #  copies drift apart; the PowerShell scripts stay for local Windows use.
    #
    #  One thing moves out rather than across: the partition-table check needs
    #  gen_esp32part.exe as its reference and is Windows-only by construction.
    #  It is its own job below.
    #
    #  ★The manifests this job writes now use LF where the Windows job wrote
    #  CRLF. The content is the same - compared line by line against the v0.3.0
    #  package - but the bytes of link-manifest.json differ from earlier
    #  releases.
    #
    name: Build the platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: arduino/setup-arduino-cli@v2

      - name: Install CMake and Ninja
        run: python -m pip install --disable-pip-version-check cmake ninja

      - name: Install the M5Stack core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$M5STACK_INDEX"
          arduino-cli core install "m5stack:esp32@$CORE_VERSION" --additional-urls "$M5STACK_INDEX"
          #  --no-deps is required. M5Unified 0.2.20 declares a bare
          #  "depends=M5GFX" with no version constraint, so without it the
          #  resolver installs the newest M5GFX and REPLACES the pinned one
          #  named on this very command line - and this job compiles the
          #  m5-unified stage against those sources, so the pin above would be
          #  silently ignored. Observed on a Linux verify run 2026-08-29:
          #  "Replacing M5GFX@0.2.27 with M5GFX@0.2.28".
          arduino-cli lib install --no-deps "M5GFX@$M5GFX_VERSION" "M5Unified@$M5UNIFIED_VERSION"

      - name: Build the prebuilt stages for both chips
        run: |
          sketchbook=$(arduino-cli config get directories.user)
          test -n "$sketchbook" || { echo "arduino-cli did not report directories.user"; exit 1; }
          for chip in esp32s3 esp32; do
            python scripts/build_prebuilt_stages.py \
              --chip "$chip" \
              --core-version "$CORE_VERSION" \
              --m5gfx-source "$sketchbook/libraries/M5GFX/src" \
              --m5unified-source "$sketchbook/libraries/M5Unified/src"
          done
          #  bt-classic is not in the default profile set and is esp32 only,
          #  so it needs its own call. Without this it was built and verified
          #  nowhere in CI while shipping in the platform.
          python scripts/build_prebuilt_stages.py \
            --chip esp32 --profiles bt-classic \
            --core-version "$CORE_VERSION" \
            --m5gfx-source "$sketchbook/libraries/M5GFX/src" \
            --m5unified-source "$sketchbook/libraries/M5Unified/src"

      - name: Assemble the platform
        #  The parent stage root, so both chips' boards go into one platform.
        run: |
          python scripts/install_platform.py \
            --sketchbook "${{ github.workspace }}/ci-sketchbook" \
            --core-version "$CORE_VERSION" \
            --prebuilt-stage-root "${{ github.workspace }}/build/prebuilt"

      - name: Check what is in the platform
        #  A stage missing here becomes a build failure four jobs later, so fail
        #  now with a readable message.
        run: |
          root=ci-sketchbook/hardware/toppers/esp32
          test -f "$root/boards.txt" || { echo "no boards.txt"; exit 1; }
          for board in m5cores3_fmp3 m5sticks3_fmp3 m5core_fmp3; do
            grep -q "^$board\.name=" "$root/boards.txt" \
              || { echo "missing board: $board"; exit 1; }
          done
          for chip in esp32s3 esp32; do
            for p in minimal m5-unified wifi-connect; do
              test -f "$root/fmp3-prebuilt/$chip/$p/link-manifest.json" \
                || { echo "missing stage: $chip/$p"; exit 1; }
            done
          done
          #  esp32 only: the ESP32-S3 has no Bluetooth Classic radio.
          test -f "$root/fmp3-prebuilt/esp32/bt-classic/link-manifest.json" \
            || { echo "missing stage: esp32/bt-classic"; exit 1; }
          grep -q "^m5core_fmp3\.menu\.FMP3Runtime\.btclassic=" "$root/boards.txt" \
            || { echo "M5Core does not offer the btclassic menu entry"; exit 1; }
          #  ★if/then, not `grep && { exit 1; }`. Under `set -e` the && form
          #  fails the step when grep finds nothing - which is the case we want
          #  to pass.
          if grep -q "^m5cores3_fmp3\.menu\.FMP3Runtime\.btclassic=" "$root/boards.txt"; then
            echo "CoreS3 must not offer btclassic (it has no BR/EDR radio)"
            exit 1
          fi
          #  gen_esp32part.exe is not shipped any more, so nothing may depend
          #  on it. The verify jobs cannot catch this: their runners have
          #  python3, so the non-Windows tool definition would still work.
          if grep -q '{tools.gen_esp32part.cmd}' "$root/platform.txt"; then
            echo "a recipe still uses gen_esp32part, which is not shipped"
            grep -n '{tools.gen_esp32part.cmd}' "$root/platform.txt"
            exit 1
          fi
          test ! -f "$root/tools/gen_esp32part.exe"             || { echo "gen_esp32part.exe is back in the platform"; exit 1; }

          #  The stages must not carry paths from this runner, or the archive is
          #  not host-independent. check_host_paths.py is the thorough version;
          #  this catches a Windows drive letter that slipped through a Windows
          #  build, and costs nothing here.
          if grep -rlE '[A-Za-z]:[\\/]' "$root/fmp3-prebuilt" --include='*.json' --include='*.rsp'; then
            echo "a stage references an absolute path"; exit 1
          fi
          python scripts/check_host_paths.py "$root"
          du -sh "$root"

      - uses: actions/upload-artifact@v4
        with:
          name: platform
          path: ci-sketchbook/hardware/toppers/esp32
          if-no-files-found: error

  partition-table:
    #  Windows-only by construction: gen_esp32part.exe is the reference the
    #  driver's own conversion is compared against, and the verify jobs cannot
    #  catch a divergence because their runners have python3 and would take the
    #  other branch of the recipe. It needs the M5Stack core, not the platform,
    #  so it does not depend on the package job.
    name: Partition table conversion (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the M5Stack core
        run: |
          arduino-cli core update-index --additional-urls "$env:M5STACK_INDEX"
          arduino-cli core install "m5stack:esp32@$env:CORE_VERSION" --additional-urls "$env:M5STACK_INDEX"

      - name: Check the partition table conversion
        run: |
          ./scripts/Test-PartitionTable.ps1 `
            -PythonExecutable (Get-Command python).Source

  verify:
    name: Install and build (${{ matrix.host }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: x86_64-pc-linux-gnu
          - runner: macos-latest
            host: arm64-apple-darwin
          #  Intel macOS is NOT in the matrix. The macos-13 job sat in
          #  "Waiting for a runner to pick up this job" for over half an hour on
          #  2026-08-30 while every other host finished, so the label no longer
          #  gets a runner. A queued job does not fail - it hangs - so leaving it
          #  in makes a release wait forever for a driver that never arrives.
          #  v0.3.0 therefore ships without an x86_64-apple-darwin driver and
          #  says so; add the host back once a working Intel label is confirmed.
          #  Windows is in the matrix as the reference the others are compared
          #  against, produced by the same CI rather than by hand.
          - runner: windows-latest
            host: x86_64-mingw32
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/download-artifact@v4
        with:
          name: platform
          path: platform

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Verify the package
        #  scripts/verify_package.py does the whole thing: freeze the driver for
        #  this host, build the package, serve it over loopback (Boards Manager
        #  will not fetch an archive over file://), install it and build every
        #  profile. The same script is what a developer runs on a machine this
        #  workflow cannot reach, so CI and hand verification share one path.
        run: >
          python scripts/verify_package.py
          --platform-dir platform
          ${{ inputs.version && format('--version {0}', inputs.version) || '' }}
          --work-dir verify
          --summary images.txt

      - name: Publish the images for cross-OS comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.host }}
          path: |
            images.txt
            verify/out-*/*.ino.bin
          if-no-files-found: warn

  compare:
    name: Compare images across hosts
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: images

      - name: Report
        #  Informational. The same compiler builds the same sources on every
        #  host, so the images are expected to match, but a difference here is a
        #  finding to investigate rather than a reason to fail the run: anything
        #  that leaks a build path into the image (__FILE__, for instance) would
        #  show up as a mismatch without meaning the build is broken.
        run: |
          reference=images/images-x86_64-mingw32/images.txt
          if [ ! -f "$reference" ]; then
            echo "no Windows reference in this run; listing what there is"
            for f in images/*/images.txt; do echo "== $f"; cat "$f"; done
            exit 0
          fi
          #  The first column is "profile/sketch", not just the
          #  profile: each profile is verified with its own example AND with a
          #  plain Blink, so the label carries both.
          echo "profile/sketch                reference        host                       verdict"
          for f in images/*/images.txt; do
            host=$(basename "$(dirname "$f")" | sed 's/^images-//')
            while read -r label size sum; do
              want=$(awk -v p="$label" '$1==p {print $3}' "$reference")
              if [ "$sum" = "$want" ]; then verdict=identical; else verdict="DIFFERS"; fi
              printf '%-29s %-16s %-26s %s\n' \
                "$label" "${want:0:12}" "$host" "$verdict"
            done <"$f"
          done
