INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "phase4_freertos_app.h"

CLASS(CLS_PRC1) {
    CRE_TSK(PHASE4_PROBE_TASK, {
        TA_ACT | TA_FPU,
        0,
        phase4_freertos_probe_task,
        PHASE4_PROBE_TASK_PRIORITY,
        PHASE4_PROBE_TASK_STACK_SIZE,
        NULL
    });

    CRE_TSK(ARDUINO_TASK, {
        TA_ACT | TA_FPU,
        0,
        toppers_arduino_task,
        ARDUINO_TASK_PRIORITY,
        ARDUINO_TASK_STACK_SIZE,
        NULL
    });

    /*
     *  セマフォ - 動的生成へ移した
     *
     *  ここには CRE_SEM(M5_SEM1..4) の静的プールが残っていた。シムは
     *  acre_sem / del_sem（wifi/shim/esp_shim_sem.c）へ移っており、その
     *  上限は AID_SEM() で決まる。AID_SEM が無いと上限は 0 なので、
     *  acre_sem は最初の 1 本目から E_NOID(-34) を返す。実機ではこう出た:
     *
     *      esp_shim: acre_sem failed ercd=-34 (ctx=0 lock=0) n=1
     *      [FreeRTOS] FAIL: binary semaphore creation
     *      [APIProbe] FreeRTOS API boundary probe FAILED
     *
     *  静的プールを持つ側は M5_SEM1..4 を名前で参照していない（生成物に
     *  しか現れない）ので、phase5_m5_app.cfg と同じ形へ揃える。
     *
     *  下の 1 本だけは残す必要がある。AID_SEM(n>0) は「同じオブジェクト種の
     *  静的生成が cfg 内に 1 個以上あること」を要求するためである。
     *  このセマフォはシムから一度も使わない。
     */
    CRE_SEM(M5_SEM_AID_GUARD, { TA_NULL, 0, TMAX_MAXSEM });
}

/*
 *  動的セマフォの上限（クラス外専用 API）
 *
 *  ★4 本であること自体が phase8_semaphore_probe() の検査対象である。
 *  5 本確保して「4 本成功・5 本目は NULL」を要求する
 *  （"all four semaphore pool slots allocate" /
 *   "fifth semaphore allocation reports pool exhaustion"）。
 *  つまりここは増やす数値ではない。旧静的プールと同じ 4 本。
 */
AID_SEM(4);
