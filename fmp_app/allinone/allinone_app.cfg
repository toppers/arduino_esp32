/*  attachInterrupt. */
INCLUDE("arduino_interrupt.cfg");
/*  Wi-Fi shim: its fixed DEF_INH lines and dynamic object limits. */
INCLUDE("esp_shim.cfg");

#include "allinone_app.h"

CLASS(CLS_PRC1) {
    CRE_TSK(ARDUINO_TASK, {
        TA_ACT | TA_FPU,
        0,
        toppers_arduino_task,
        ARDUINO_TASK_PRIORITY,
        ARDUINO_TASK_STACK_SIZE,
        NULL
    });

    /*
     *  Guard for AID_SEM below: AID_SEM(n>0) requires at least one statically
     *  created semaphore of the same kind. The shim never uses this one.
     */
    CRE_SEM(M5_SEM_AID_GUARD, { TA_NULL, 0, TMAX_MAXSEM });
}

/*
 *  Dynamic semaphore ceiling. m5-unified declares 4 for M5GFX; esp_shim.cfg
 *  brings its own AID_SEM for the Wi-Fi side, so this is the M5 share only.
 *  ★Upstream flagged "24 semaphores may not be enough for M5GFX + Wi-Fi
 *    together" as unmeasured. If it runs out, esp_shim_sem.c counts the
 *    acre_sem failures - raise this number, do not widen a pool.
 */
AID_SEM(4);
