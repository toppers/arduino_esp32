INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "phase5_m5_app.h"

/*  attachInterrupt 用の CFG_INT / ENA_DYNISR / AID_ISR。 */
INCLUDE("arduino_interrupt.cfg");

CLASS(CLS_PRC1) {
    CRE_TSK(ARDUINO_TASK, {
        TA_ACT | TA_FPU,
        0,
        toppers_arduino_task,
        ARDUINO_TASK_PRIORITY,
        ARDUINO_TASK_STACK_SIZE,
        NULL
    });

    /*
     *  セマフォ — 動的生成へ移した
     *
     *  実体は AID_SEM()（このブロックの外・下記）＋ acre_sem / del_sem
     *  （wifi/shim/esp_shim_sem.c。wifi プロファイルと同じ実装を使う）。
     *  かつてここに在った CRE_SEM(M5_SEM1..4) はプールごと廃止した。
     *
     *  下の 1 本だけは残す必要がある。AID_SEM(n>0) は「同じオブジェクト種の
     *  静的生成が cfg 内に 1 個以上あること」を要求するためである。
     *  このセマフォはシムから一度も使わない——使うと静的経路と動的経路の
     *  二本立てになる。
     */
    CRE_SEM(M5_SEM_AID_GUARD, { TA_NULL, 0, TMAX_MAXSEM });

    /*
     *  The spinlock behind the FreeRTOS ABI (m5/shim/m5_freertos_abi.c).
     *  One lock for every queue, semaphore and portMUX: loc_spn is legal in
     *  task and interrupt context and excludes across both cores, which
     *  loc_cpu does not.
     */
    CRE_SPN(M5_ABI_SPN, { TA_NULL });

    /*
     *  The four slots of the IDF interrupt allocator shim
     *  (m5/shim/esp_shim_intr.c): esp_intr_alloc_intrstatus routes a
     *  peripheral source to one of these CPU lines through the interrupt
     *  matrix and esp_shim_intr_isr(exinf = slot) calls the handler it was
     *  given. The lines and their order must match esp_shim_intr_cpu_line[]
     *  there; a line routed with no CRE_ISR here would fire into nothing.
     *
     *  All four are EXTERN_LEVEL level-1 lines on both the ESP32-S3 and the
     *  ESP32, so TMAX_INTPRI. TA_NULL, not TA_ENAINT: the shim enables a
     *  line when it hands the slot out, and a line left enabled with no
     *  owner would take a level interrupt it cannot clear if anything were
     *  ever mapped to it by default.
     *
     *  Only the m5-unified cfg has these. Wi-Fi profiles own line 8
     *  themselves (esp/shim DEF_INH), so the allocator is not for them.
     */
    CFG_INT(4, { TA_NULL, TMAX_INTPRI });
    CRE_ISR(ISR_ESPINTR0, { TA_NULL, 0, 4, esp_shim_intr_isr, 1 });
    CFG_INT(8, { TA_NULL, TMAX_INTPRI });
    CRE_ISR(ISR_ESPINTR1, { TA_NULL, 1, 8, esp_shim_intr_isr, 1 });
    CFG_INT(9, { TA_NULL, TMAX_INTPRI });
    CRE_ISR(ISR_ESPINTR2, { TA_NULL, 2, 9, esp_shim_intr_isr, 1 });
    CFG_INT(12, { TA_NULL, TMAX_INTPRI });
    CRE_ISR(ISR_ESPINTR3, { TA_NULL, 3, 12, esp_shim_intr_isr, 1 });

    /*
     *  First worker slot for xTaskCreate* (esp_shim_task_create hands out
     *  the lowest free slot). On PRC1 because the interrupt shim allocates
     *  and wires handlers on PRC1 only (esp_shim_intr.c), and a driver's
     *  worker usually shares data with its handler. Dormant until created.
     */
    CRE_TSK(M5_AUDIO_TSK1, {
        TA_FPU,
        0,
        m5_audio_task_entry,
        M5_AUDIO_TASK_PRIORITY,
        M5_AUDIO_STACK_SIZE,
        NULL
    });
}

/*
 *  Second worker slot, on PRC2, so that a second worker does not compete
 *  with the sketch for PRC1. Anything it shares with PRC1 must go through
 *  the ABI above; the older shim paths guarded by loc_cpu are not safe
 *  across cores.
 */
CLASS(CLS_PRC2) {
    CRE_TSK(M5_AUDIO_TSK2, {
        TA_FPU,
        1,
        m5_audio_task_entry,
        M5_AUDIO_TASK_PRIORITY,
        M5_AUDIO_STACK_SIZE,
        NULL
    });
}

/*
 *  動的セマフォの上限（クラス外専用 API）
 *
 *  旧プールと同じ 4 本。静的プールには「枯渇で NULL を返し、呼び側が
 *  永久に待つことがある」という失敗モードが記録されていたが、上限を
 *  変えるのは非退行の確認とは別の判断なので、本数はそのままにする。
 *  足りないと分かったらこの数値だけを変えればよい。
 */
AID_SEM(4);
