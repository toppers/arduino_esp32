/*
 *  M5Unified profile の自己診断アプリケーション
 *
 *  配布用の構成をそのまま取り込み、監視タスクを 1 本足すだけ。
 *  ★差分をここに閉じ込めることで、配布する構成と検査する構成が
 *    ずれないようにしている（配布側を直せば自動的にこちらへ効く）。
 *
 *  ★cfg の #ifdef で切り替えてはならない。cfg pass1 はプリプロセッサを
 *    走らせず、`#ifdef` の中の CRE_TSK もそのまま静的 API として拾う。
 *    切り替えは「どの .cfg を渡すか」で行う。
 */

INCLUDE("phase5_m5_app.cfg");

#include "phase5_m5_selftest.h"

CLASS(CLS_PRC1) {
    CRE_TSK(PHASE5_MONITOR_TASK, {
        TA_ACT | TA_FPU,
        0,
        phase5_monitor_task,
        PHASE5_MONITOR_TASK_PRIORITY,
        PHASE5_MONITOR_TASK_STACK_SIZE,
        NULL
    });

    /*  SMP 分離検査。 */
    CRE_TSK(PHASE5_SMP_MONITOR_TASK, {
        TA_ACT | TA_FPU,
        0,
        phase5_smp_monitor_task,
        PHASE5_SMP_MONITOR_TASK_PRIORITY,
        PHASE5_SMP_MONITOR_TASK_STACK_SIZE,
        NULL
    });
}

/*
 *  PRC2 の独立ワーカ。m5-unified は FMP3_PRC_NUM=2 で建つので
 *  CLS_PRC2 が存在する。配布用 cfg にはこれが無く、PRC2 は空いている。
 */
CLASS(CLS_PRC2) {
    CRE_TSK(PHASE5_PRC2_TASK, {
        TA_ACT | TA_FPU,
        0,
        phase5_prc2_task,
        PHASE5_PRC2_TASK_PRIORITY,
        PHASE5_PRC2_TASK_STACK_SIZE,
        NULL
    });
}
