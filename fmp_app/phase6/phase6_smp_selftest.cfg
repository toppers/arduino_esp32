/*
 *  dual-core profile の自己診断アプリケーション
 *
 *  配布用の構成をそのまま取り込み、監視タスク（PRC1）と
 *  PRC2 の実演ワーカを足す。
 *  ★差分をここに閉じ込めることで、配布する構成と検査する構成が
 *    ずれないようにしている。
 *
 *  ★cfg の #ifdef で切り替えてはならない。cfg pass1 はプリプロセッサを
 *    走らせず、`#ifdef` の中の CRE_TSK もそのまま静的 API として拾う。
 *    切り替えは「どの .cfg を渡すか」で行う。
 */

INCLUDE("phase6_smp_app.cfg");

#include "phase6_smp_selftest.h"

CLASS(CLS_PRC1) {
    CRE_TSK(PHASE6_MONITOR_TASK, {
        TA_ACT | TA_FPU,
        0,
        phase6_monitor_task,
        PHASE6_MONITOR_TASK_PRIORITY,
        PHASE6_MONITOR_TASK_STACK_SIZE,
        NULL
    });
}

CLASS(CLS_PRC2) {
    CRE_TSK(PHASE6_PRC2_TASK, {
        TA_ACT | TA_FPU,
        0,
        phase6_prc2_task,
        PHASE6_PRC2_TASK_PRIORITY,
        PHASE6_PRC2_TASK_STACK_SIZE,
        NULL
    });
}
