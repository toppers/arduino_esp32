INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "standalone_app.h"

/*
 *  ここに ARDUINO_TASK は無い。それがこのアプリケーションの全目的である。
 *
 *  他のアプリケーションの cfg はすべて
 *      CRE_TSK(ARDUINO_TASK, { ..., toppers_arduino_task, ... });
 *  を持ち、`toppers_arduino_task` は src/bridge/ArduinoSketchBridge.cpp
 *  ——Arduino builder がコンパイルするオブジェクト——にある。
 *  そのため、スケッチのオブジェクトを繋がずに FMP3 イメージを建てようとすると
 *  どのアプリケーションでも
 *      undefined reference to `toppers_arduino_task'
 *  で止まっていた。
 *
 *  Test-RecipeOverride.ps1 が主張したいのは「Arduino がリンクに一切関与せずとも
 *  arduino-cli の recipe override 経由で FMP3 イメージを publish できる」こと
 *  なので、その主張には Arduino を参照しないアプリケーションが要る。
 */
CLASS(CLS_PRC1) {
    CRE_TSK(STANDALONE_TASK, {
        TA_ACT,
        0,
        standalone_task,
        STANDALONE_TASK_PRIORITY,
        STANDALONE_TASK_STACK_SIZE,
        NULL
    });
}
